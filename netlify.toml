# Homebase is plain static HTML. There is deliberately no [build] block:
# on a drag-and-drop deploy there is nothing to build, and declaring
# publish/command there pointed Netlify at the wrong directory and produced a
# 404. Git-connected deploys default to the repo root, which is what we want,
# so the block is unnecessary in both cases.

# Revalidate HTML on every load so a new deploy shows up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SAMEORIGIN, not DENY: Homebase previews the offer builder in an iframe.
    X-Frame-Options = "SAMEORIGIN"
