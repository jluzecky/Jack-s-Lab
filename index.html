// Comps that count toward stats, the report, and the PDF: priced and not excluded.
const activeComps = (x) => ((x&&x.comps)||[]).filter(c=>+c.salePrice>0 && !c.excluded);
const median = (arr) => { if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2); };
const featVal = (adjLib,id) => { const a=adjLib.find(x=>x.id===id); return a?a.value:0; };
const featName = (adjLib,id) => { const a=adjLib.find(x=>x.id===id); return a?a.name:"?"; };
const sumSel = (adjLib,ids=[]) => ids.reduce((s,id)=>s+featVal(adjLib,id),0);
// effective adjustment for one row of one comp
function rowAdj(cma,comp,row,adjLib){
  if(row.kind==="category"){
    if(comp.adjAuto && comp.adjAuto[row.key]===false) return +comp.adj?.[row.key]||0;
    return sumSel(adjLib,cma.subj?.sel?.[row.key]||[]) - sumSel(adjLib,comp.sel?.[row.key]||[]);
  }
  return +comp.adj?.[row.key]||0;
}
const cmaRows = (cma) => (cma.rows&&cma.rows.length)?cma.rows:DEFAULT_ROWS;
function netAdj(cma,comp,adjLib){ return cmaRows(cma).reduce((s,r)=>s+rowAdj(cma,comp,r,adjLib),0); }
function adjustedPrice(cma,comp,adjLib){ return (+comp.salePrice||0)+netAdj(cma,comp,adjLib); }
function compPPSF(comp){ const g=parseFloat(comp.val?.gla)||0; return g>0?Math.round((+comp.salePrice||0)/g):0; }

// The stored `suggested` is only written when a CMA is saved through the
// editor, so a CMA that predates that (or was seeded) reads blank in the
// library while the detail view computes a figure from the same comps.
// Derive it the way the detail view does; fall back to the stored value.
function cmaSuggested(cma, adjLib){
  const comps=cma.comps||[];
  if(comps.length) return median(comps.map(c=>adjustedPrice(cma,c,adjLib)));
  return +cma.suggested||0;
}

function MyCMAs({cmas,saveCmas,adjLib,saveAdjLib,adjCats,saveAdjCats,profile,saveProfile,addrOptions,onPromote}) {
  const S=useSettings(); const CSTAT=names(S.cmaStatuses); const cmaColors=colorMap(S.cmaStatuses);
  const [tab,setTab]=useState("library");
  const [reportId,setReportId]=useState(null);
  const [statusFilter,setStatusFilter]=useState("All");
  const [search,setSearch]=useState("");
  const [sort,setSort]=useState("date");
  const [open,setOpen]=useState(null);

  const blankComp=()=>({id:uid(),address:"",salePrice:"",saleDate:"",val:{},sel:{},adj:{},adjAuto:{}});
  const blank=()=>({subject:"",zip:"",client:"",listPrice:"",status:"Draft",photosLink:"",compsLink:"",heroPhoto:"",date:new Date().toLocaleDateString("en-US"),notes:"",
    rows:DEFAULT_ROWS.map(r=>({...r})), subj:{concessions:"n/a",condition:"",rooms:"",gla:"",misc:"",sel:{}}, comps:[blankComp(),blankComp(),blankComp()]});
  const [b,setB]=useState(blank());
  const [editId,setEditId]=useState(null);
  const [picker,setPicker]=useState(null); // {who:'subj'|compId, key}
  const [showRows,setShowRows]=useState(false);

  const fC=useMemo(()=>{
    let rows=[...cmas];
    if(statusFilter!=="All") rows=rows.filter(c=>(c.status||"Draft")===statusFilter);
    if(search){const q=search.toLowerCase();rows=rows.filter(c=>(c.subject||"").toLowerCase().includes(q)||(c.client||"").toLowerCase().includes(q)||(c.zip||"").includes(q));}
    rows.sort((a,b)=>{
      if(sort==="date") return parseDate(b.date)-parseDate(a.date);
      if(sort==="subject") return (a.subject||"").localeCompare(b.subject||"");
      if(sort==="value") return cmaSuggested(b,adjLib)-cmaSuggested(a,adjLib);
      if(sort==="status") return CSTAT.indexOf(a.status||"Draft")-CSTAT.indexOf(b.status||"Draft");
      return 0;
    });
    return rows;
  },[cmas,statusFilter,search,sort,adjLib]);
  const statusCounts=useMemo(()=>{const m={};cmas.forEach(c=>{const s=c.status||"Draft";m[s]=(m[s]||0)+1;});return m;},[cmas]);
  const adjusted=useMemo(()=>activeComps(b).map(c=>adjustedPrice(b,c,adjLib)),[b,adjLib]);
  const summary=useMemo(()=>{
    if(!adjusted.length) return null;
    const subjGla=parseFloat(b.subj.gla)||0;const med=median(adjusted);
    return { low:Math.min(...adjusted), high:Math.max(...adjusted), avg:Math.round(adjusted.reduce((s,x)=>s+x,0)/adjusted.length), med, n:adjusted.length, ppsf:subjGla>0?Math.round(med/subjGla):0 };
  },[adjusted,b.subj.gla]);

  // available categories: persisted list, plus any category present in values (defensive), preserving order
  const warehouseCats=useMemo(()=>{
    const seen=new Set(); const out=[];
    [...adjCats, ...adjLib.map(a=>a.cat||"Other")].forEach(c=>{ if(c&&!seen.has(c)){seen.add(c);out.push(c);} });
    return out;
  },[adjCats,adjLib]);
  // candidate rows = manual defaults + one category row per warehouse category
  const candidateRows=useMemo(()=>{
    const manualKeys=new Set(MANUAL_ROW_DEFS.map(r=>r.key));
    const cats=warehouseCats.map(cat=>({key:catKey(cat),label:cat,kind:"category",cat})).filter(r=>!manualKeys.has(r.key));
    const all=[...MANUAL_ROW_DEFS.map(r=>({...r})),...cats];
    return all.sort((a,b)=>orderIdx(a.key)-orderIdx(b.key));
  },[warehouseCats]);
  const rowIncluded=(key)=>b.rows.some(r=>r.key===key);
  const toggleRow=(cand)=>{
    setB(p=>{
      if(p.rows.some(r=>r.key===cand.key)) return {...p,rows:p.rows.filter(r=>r.key!==cand.key)};
      const next=[...p.rows,{...cand}].sort((a,b)=>orderIdx(a.key)-orderIdx(b.key));
      return {...p,rows:next};
    });
  };

  const setSubj=(k,v)=>setB(p=>({...p,subj:{...p.subj,[k]:v}}));
  const setCompField=(id,k,v)=>setB(p=>({...p,comps:p.comps.map(c=>c.id===id?{...c,[k]:v}:c)}));
  const setCompVal=(id,k,v)=>setB(p=>({...p,comps:p.comps.map(c=>c.id===id?{...c,val:{...c.val,[k]:v}}:c)}));
  const setCompAdj=(id,k,v)=>setB(p=>({...p,comps:p.comps.map(c=>c.id===id?{...c,adj:{...c.adj,[k]:+v||0},adjAuto:{...c.adjAuto,[k]:false}}:c)}));
  const revertAuto=(id,k)=>setB(p=>({...p,comps:p.comps.map(c=>c.id===id?{...c,adjAuto:{...c.adjAuto,[k]:true}}:c)}));
  const addComp=()=>setB(p=>({...p,comps:[...p.comps,blankComp()]}));
  const delComp=(id)=>setB(p=>({...p,comps:p.comps.filter(c=>c.id!==id)}));

  // toggle a feature selection for subject or a comp on a category row
  const toggleSel=(who,key,featId)=>{
    setB(p=>{
      if(who==="subj"){const cur=p.subj.sel?.[key]||[];const nx=cur.includes(featId)?cur.filter(x=>x!==featId):[...cur,featId];return {...p,subj:{...p.subj,sel:{...p.subj.sel,[key]:nx}}};}
      return {...p,comps:p.comps.map(c=>{if(c.id!==who)return c;const cur=c.sel?.[key]||[];const nx=cur.includes(featId)?cur.filter(x=>x!==featId):[...cur,featId];return {...c,sel:{...c.sel,[key]:nx}};})};
    });
  };

  const saveCMA=()=>{
    if(!b.subject)return;
    const rec={...b,id:editId||uid(),listPrice:+b.listPrice||0,comps:b.comps.map(c=>({...c,salePrice:+c.salePrice||0})),suggested:summary?.med||0};
    if(editId) saveCmas(cmas.map(c=>c.id===editId?rec:c)); else saveCmas([rec,...cmas]);
    setB(blank());setEditId(null);setTab("library");
  };
  const editCMA=(c)=>{ const base=blank(); setB({...base,...c,rows:(c.rows&&c.rows.length?c.rows:DEFAULT_ROWS).map(r=>({...r})),subj:{...base.subj,...c.subj,sel:{...(c.subj?.sel||{})}},listPrice:c.listPrice||"",comps:(c.comps||[]).map(cp=>({...blankComp(),...cp,salePrice:cp.salePrice||"",val:{...cp.val},sel:{...cp.sel},adj:{...cp.adj},adjAuto:{...cp.adjAuto}}))}); setEditId(c.id);setTab("build");setOpen(null); };
  const delCMA=(id)=>{if(confirm("Delete this CMA?")){saveCmas(cmas.filter(c=>c.id!==id));setOpen(null);}};
  const setStatus=(id,status)=>saveCmas(cmas.map(c=>c.id===id?{...c,status}:c));
  const openCma=open?cmas.find(c=>c.id===open):null;

  // ── feature picker (inline checklist within a cell) ──
  const CatPicker=({who,row})=>{
    const items=adjLib.filter(a=>(a.cat||"Other")===row.cat);
    const selected = who==="subj"?(b.subj.sel?.[row.key]||[]):(b.comps.find(c=>c.id===who)?.sel?.[row.key]||[]);
    const isOpen = picker&&picker.who===who&&picker.key===row.key;
    return <div>
      <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:3}}>
        {selected.length===0&&<span style={{fontSize:10,color:"var(--ink-3)",fontFamily:SANS}}>none</span>}
        {selected.map(id=><span key={id} style={{fontSize:9,padding:"1px 5px",borderRadius:8,background:"#e0e7ff",color:"#3730a3",fontFamily:SANS}}>{featName(adjLib,id)}</span>)}
      </div>
      <button onClick={()=>setPicker(isOpen?null:{who,key:row.key})} style={{...btnGhost,fontSize:10,padding:"2px 7px"}}>{isOpen?"Done":"Select ▾"}</button>
      {isOpen&&<div style={{marginTop:4,padding:6,background:"var(--surface)",border:"1px solid var(--line-2)",borderRadius:6}}>
        {items.length===0&&<div style={{fontSize:10,color:"var(--ink-3)",fontFamily:SANS}}>No values in {row.cat}.</div>}
        {items.map(a=><label key={a.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,fontFamily:SANS,padding:"2px 0",cursor:"pointer"}}>
          <input type="checkbox" checked={selected.includes(a.id)} onChange={()=>toggleSel(who,row.key,a.id)} style={{margin:0}}/>
          <span style={{flex:1}}>{a.name}</span><span style={{color:"var(--ink-2)"}}>{fmt(a.value)}</span>
        </label>)}
      </div>}
    </div>;
  };

  return <div>
    <div style={{display:"flex",borderBottom:"1px solid var(--line-3)",marginBottom:18,overflowX:"auto"}}>
      {[["library","CMA Library"],["build",editId?"Edit CMA":"New CMA"],["adj","Adjustment Values"]].map(([k,l])=><button key={k} onClick={()=>{setTab(k);if(k==="build"&&!editId)setB(blank());}} style={subTab(tab===k)}>{l}</button>)}
    </div>

    {tab==="library"&&<div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <input placeholder="Search subject, client, zip…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:180,padding:"7px 12px",fontSize:13,borderRadius:8,border:"1px solid var(--line)",background:"var(--surface)",color:"var(--ink)",fontFamily:SANS}}/>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"7px 12px",fontSize:13,borderRadius:8,border:"1px solid var(--line)",background:"var(--surface)",color:"var(--ink)",fontFamily:SANS}}>
          <option value="date">Sort: Newest</option><option value="subject">Sort: Address A–Z</option><option value="value">Sort: Suggested value</option><option value="status">Sort: Status</option>
        </select>
        <button onClick={()=>{setB(blank());setEditId(null);setTab("build");}} style={{...btnGhost,background:"var(--accent)",color:"#fff",border:"none",padding:"7px 14px"}}>+ New CMA</button>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
        <button onClick={()=>setStatusFilter("All")} style={chip(statusFilter==="All")}>All ({cmas.length})</button>
        {CSTAT.map(s=><button key={s} onClick={()=>setStatusFilter(s)} style={chip(statusFilter===s)}>{s} ({statusCounts[s]||0})</button>)}
      </div>
      {fC.length===0&&<div style={{fontSize:13,color:"var(--ink-2)",fontFamily:SANS,padding:"30px 0",textAlign:"center"}}>{cmas.length===0?<>No CMAs yet. Click <strong>+ New CMA</strong> to build one.</>:"No CMAs match these filters."}</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
        {fC.map(c=>{const sc=cmaColors[c.status||"Draft"]||{bg:"#eee",text:"#555"};return <div key={c.id} onClick={()=>setOpen(c.id)} className="hb-hover" style={{background:"var(--surface)",border:"1px solid var(--line)",borderRadius:12,padding:16,cursor:"pointer",borderLeft:`3px solid ${sc.text}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div style={{fontWeight:600,fontSize:14,color:"var(--ink)",fontFamily:SANS}}>{c.subject}</div>
            <Pill color={sc}>{c.status||"Draft"}</Pill>
          </div>
          <div style={{fontSize:12,color:"var(--ink-2)",fontFamily:SANS,marginBottom:10}}>{c.client||"—"} · {c.zip||"—"} · {c.date}</div>
          <div style={{display:"flex",gap:16}}>
            <div><div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase"}}>List / Target</div><div style={{fontSize:15,fontWeight:600,fontFamily:SANS}}>{c.listPrice?fmt(c.listPrice):"—"}</div></div>
            <div><div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase"}}>Suggested</div><div style={{fontSize:15,fontWeight:600,color:"#0f7a52",fontFamily:SANS}}>{(()=>{const sg=cmaSuggested(c,adjLib);return sg?fmt(sg):"—";})()}</div></div>
          </div>
          <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:8}}>{c.comps?.length||0} comps · {cmaRows(c).length} rows</div>
        </div>;})}
      </div>

      {openCma&&<div style={{marginTop:20,background:"var(--surface-3)",borderRadius:12,padding:20,border:"1px solid var(--line-2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,gap:10,flexWrap:"wrap"}}>
          <div><div style={{fontSize:17,fontWeight:600,fontFamily:SANS,color:"var(--ink)"}}>{openCma.subject}</div><div style={{fontSize:12,color:"var(--ink-2)",fontFamily:SANS}}>{openCma.client||"—"} · {openCma.zip} · {openCma.date}</div></div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <select value={openCma.status||"Draft"} onChange={e=>setStatus(openCma.id,e.target.value)} style={{padding:"6px 10px",fontSize:12,borderRadius:6,border:"1px solid var(--line)",background:"var(--surface)",color:"var(--ink)",fontFamily:SANS}}>
              {CSTAT.map(s=><option key={s}>{s}</option>)}
            </select>
            <button onClick={()=>setReportId(openCma.id)} style={{...btnGhost,borderColor:"var(--accent)",color:"var(--accent)",fontWeight:600}}>Export PDF</button>
            {openCma.promotedTo
              ? <span title="A pipeline deal was created from this CMA" style={{fontSize:11,fontFamily:SANS,color:"#0f7a52",fontWeight:700,border:"1px solid #0f7a52",borderRadius:5,padding:"5px 10px",whiteSpace:"nowrap"}}>✓ In Pipeline</span>
              : null}
            {onPromote&&<button onClick={()=>onPromote(openCma)} title="Create a pipeline deal from this CMA" style={{...btnGhost,borderColor:"#0f7a52",color:"#0f7a52",fontWeight:600}}>→ Promote to Pipeline</button>}
            <button onClick={()=>editCMA(openCma)} style={btnGhost}>Edit</button><button onClick={()=>delCMA(openCma.id)} style={{...btnGhost,color:"#b3392c"}}>Delete</button><button onClick={()=>setOpen(null)} style={btnGhost}>Close</button>
          </div>
        </div>
        {openCma.comps?.length>0&&<>
          {(()=>{const adj=openCma.comps.map(c=>adjustedPrice(openCma,c,adjLib));const subjGla=parseFloat(openCma.subj?.gla)||0;const med=median(adj);return (
            <div className="hb-grid-4" style={{margin:"14px 0"}}>
              <Card l="Suggested (Median)" v={fmt(med)} accent="#0f7a52"/>
              <Card l="Average" v={fmt(Math.round(adj.reduce((s,x)=>s+x,0)/adj.length))}/>
              <Card l="Range" v={`${fmtS(Math.min(...adj))}–${fmtS(Math.max(...adj))}`}/>
              <Card l="Implied $/SF" v={subjGla>0?`$${Math.round(med/subjGla)}`:"—"}/>
            </div>
          );})()}
          <div className="hb-tablescroll"><table className="hb-rows" style={{borderCollapse:"collapse",fontSize:11,fontFamily:SANS,minWidth:"100%"}}>
            <thead><tr style={{borderBottom:"1px solid var(--line)"}}>
              <th style={{...thS,position:"sticky",left:0,background:"var(--surface-3)"}}>Specs</th>
              <th style={thS}>Subject</th>
              {openCma.comps.map(cp=><th key={cp.id} style={{...thS,minWidth:130}}>{cp.address||"Comp"}</th>)}
            </tr></thead>
            <tbody>
              <tr style={{borderBottom:"1px solid var(--line)"}}><td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Sale Price</td><td style={tdS()}>—</td>{openCma.comps.map(cp=><td key={cp.id} style={tdS({fontWeight:600})}>{fmt(cp.salePrice)}</td>)}</tr>
              <tr style={{borderBottom:"1px solid var(--line)"}}><td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Date / $SF</td><td style={tdS({color:"var(--ink-2)"})}>{openCma.subj.gla} sf</td>{openCma.comps.map(cp=><td key={cp.id} style={tdS({color:"var(--ink-2)"})}>{cp.saleDate} · ${compPPSF(cp)}</td>)}</tr>
              {cmaRows(openCma).map(r=><tr key={r.key} style={{borderBottom:"1px solid var(--line)"}}>
                <td style={{...tdS({position:"sticky",left:0,background:"var(--surface-3)",color:"var(--ink-2)"})}}>{r.label}{r.kind==="category"&&<span style={{marginLeft:4,fontSize:9,color:"var(--accent)"}}>auto</span>}</td>
                <td style={tdS()}>{r.kind==="category"?(openCma.subj?.sel?.[r.key]||[]).map(id=>featName(adjLib,id)).join(", ")||"—":(openCma.subj[r.key]||"—")}</td>
                {openCma.comps.map(cp=>{const a=rowAdj(openCma,cp,r,adjLib);const v=r.kind==="category"?((cp.sel?.[r.key]||[]).map(id=>featName(adjLib,id)).join(", ")||"—"):(cp.val?.[r.key]||"—");return <td key={cp.id} style={tdS()}><div>{v}</div>{a!==0&&<div style={{fontSize:10,color:a<0?"#dc2626":"#0f7a52"}}>{a<0?"":"+"}{fmt(a)}</div>}</td>;})}
              </tr>)}
              <tr style={{borderTop:"1px solid var(--line)"}}><td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Net Adjustment</td><td style={tdS()}></td>{openCma.comps.map(cp=>{const n=netAdj(openCma,cp,adjLib);return <td key={cp.id} style={tdS({fontWeight:500,color:n<0?"#dc2626":"#0f7a52"})}>{n<0?"":"+"}{fmt(n)}</td>;})}</tr>
              <tr style={{background:"var(--surface)"}}><td style={{...tdS({fontWeight:700,position:"sticky",left:0,background:"var(--surface)"})}}>Adjusted Price</td><td style={tdS()}></td>{openCma.comps.map(cp=><td key={cp.id} style={tdS({fontWeight:700,color:"#0f7a52"})}>{fmt(adjustedPrice(openCma,cp,adjLib))}</td>)}</tr>
            </tbody>
          </table></div>
        </>}
        {openCma.photosLink&&<div style={{marginTop:12,fontSize:13,fontFamily:SANS}}><span style={{color:"var(--ink-2)"}}>Photos: </span><a href={openCma.photosLink} target="_blank" rel="noopener noreferrer" style={{color:"var(--accent)",fontWeight:600,wordBreak:"break-all"}}>{openCma.photosLink}</a></div>}
        {openCma.compsLink&&<div style={{marginTop:6,fontSize:13,fontFamily:SANS}}><span style={{color:"var(--ink-2)"}}>Comps (MLS): </span><a href={openCma.compsLink} target="_blank" rel="noopener noreferrer" style={{color:"var(--accent)",fontWeight:600,wordBreak:"break-all"}}>{openCma.compsLink}</a></div>}
        {openCma.notes&&<div style={{fontSize:13,fontFamily:SANS,color:"var(--ink)",background:"var(--surface)",borderRadius:8,padding:12,lineHeight:1.6,marginTop:12}}>{openCma.notes}</div>}
      </div>}
    </div>}

    {tab==="build"&&<div>
      <Section title="Subject property">
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 2fr",gap:10,marginBottom:10}}>
          <div>{inp(b.subject,v=>setB(p=>({...p,subject:v})),"Subject address","text",{padding:"7px 10px"})}</div>
          <div>{inp(b.zip,v=>setB(p=>({...p,zip:v})),"Zip","text",{padding:"7px 10px"})}</div>
          <div>{inp(b.client,v=>setB(p=>({...p,client:v})),"Client / purpose","text",{padding:"7px 10px"})}</div>
        </div>
        <div className="hb-grid-2" style={{marginBottom:10}}>
          <div>{inp(b.listPrice,v=>setB(p=>({...p,listPrice:v})),"List / target $","number",{padding:"7px 10px"})}</div>
          <div>{sel(b.status,v=>setB(p=>({...p,status:v})),CSTAT,{padding:"7px 10px"})}</div>
        </div>
        <div className="hb-grid-2" style={{}}>
          <div>{inp(b.photosLink,v=>setB(p=>({...p,photosLink:v})),"Subject photos link (gallery, Drive, MLS…)","text",{padding:"7px 10px"})}</div>
          <div>{inp(b.compsLink,v=>setB(p=>({...p,compsLink:v})),"Comps link (MLS — view each comparable)","text",{padding:"7px 10px"})}</div>
        </div>
        <div style={{marginBottom:10}}>
          <div>{inp(b.heroPhoto,v=>setB(p=>({...p,heroPhoto:v})),"Cover photo — paste an image URL, or upload below","text",{padding:"7px 10px"})}</div>
          <div style={{marginTop:8}}>
            <ImagePicker label="Cover photo — upload" hint="Recommended: uploads always work in the PDF" value={(b.heroPhoto||"").startsWith("data:")?b.heroPhoto:""} onChange={v=>setB(p=>({...p,heroPhoto:v}))} maxW={1400} quality={0.72} boxH={70}/>
          </div>
          <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:6,lineHeight:1.5}}>Uploading is the reliable option. A pasted link shows in the preview, but most photo hosts block copying, which stops it from being embedded in the downloaded PDF.</div>
        </div>
      </Section>

      <>
        <div style={{background:"var(--surface-3)",borderRadius:10,padding:14,marginBottom:14,border:"1px solid var(--line)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}} onClick={()=>setShowRows(s=>!s)}>
            <div style={{fontSize:12,fontWeight:600,fontFamily:SANS,color:"var(--ink)"}}>Comparison rows <span style={{color:"var(--ink-2)",fontWeight:400}}>({b.rows.length} active)</span></div>
            <span style={{fontSize:12,color:"var(--ink-2)"}}>{showRows?"▴ hide":"▾ configure"}</span>
          </div>
          {showRows&&<div style={{marginTop:12}}>
            <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:8}}>Toggle which rows appear in the grid. <strong>Category rows</strong> (tagged) pull selectable features and dollar values from your Adjustment Values library and auto-compute the adjustment.</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {candidateRows.map(cand=>{const on=rowIncluded(cand.key);return <button key={cand.key} onClick={()=>toggleRow(cand)} style={{fontSize:11,padding:"4px 11px",borderRadius:16,border:"1px solid",fontFamily:SANS,cursor:"pointer",background:on?"var(--accent)":"transparent",color:on?"#fff":"var(--ink-2)",borderColor:on?"var(--accent)":"var(--line)"}}>{on?"✓ ":""}{cand.label}{cand.kind==="category"&&<span style={{marginLeft:4,fontSize:9,opacity:0.8}}>· auto</span>}</button>;})}
            </div>
          </div>}
        </div>

        <Section title="Comparable grid">
          <div className="hb-tablescroll"><table className="hb-rows" style={{borderCollapse:"collapse",fontSize:11,fontFamily:SANS}}>
            <thead>
              <tr style={{borderBottom:"1px solid var(--line)"}}>
                <th style={{...thS,position:"sticky",left:0,background:"var(--surface-3)",minWidth:130}}>Specs</th>
                <th style={{...thS,minWidth:130}}>Subject</th>
                {b.comps.map(cp=><th key={cp.id} style={{...thS,minWidth:170,background:cp.excluded?"#f1e8e4":thS.background}}><div style={{display:"flex",alignItems:"center",gap:5}}>
                  <label title={cp.excluded?"Excluded — not counted in stats or the PDF. Check to include.":"Included in stats and the PDF. Uncheck to exclude without deleting."} style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",flex:1,minWidth:0}}>
                    <input type="checkbox" checked={!cp.excluded} onChange={e=>setB(p=>({...p,comps:p.comps.map(x=>x.id===cp.id?{...x,excluded:!e.target.checked}:x)}))} style={{margin:0,cursor:"pointer",accentColor:"var(--accent)"}}/>
                    <span style={{flex:1,color:cp.excluded?"#b3392c":"inherit"}}>{cp.excluded?"Excluded":"Comp"}</span>
                  </label>
                  <button onClick={()=>delComp(cp.id)} title="Delete this comp entirely" style={{...btnGhost,fontSize:10,padding:"1px 6px",color:"#b3392c"}}>×</button></div></th>)}
              </tr>
            </thead>
            <tbody>
              <tr style={{borderBottom:"1px solid var(--line)"}}>
                <td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Address</td>
                <td style={tdS()}>{inp(b.subject,v=>setB(p=>({...p,subject:v})),"Subject")}</td>
                {b.comps.map(cp=><td key={cp.id} style={tdS()}>{inp(cp.address,v=>setCompField(cp.id,"address",v),"Comp address")}</td>)}
              </tr>
              <tr style={{borderBottom:"1px solid var(--line)"}}>
                <td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Sale Price</td>
                <td style={tdS({color:"var(--ink-2)"})}>—</td>
                {b.comps.map(cp=><td key={cp.id} style={tdS()}>{inp(cp.salePrice,v=>setCompField(cp.id,"salePrice",v),"$","number")}</td>)}
              </tr>
              <tr style={{borderBottom:"1px solid var(--line)"}}>
                <td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Date / $SF</td>
                <td style={tdS({color:"var(--ink-2)"})}>{parseFloat(b.subj.gla)>0?`${b.subj.gla} sf`:"—"}</td>
                {b.comps.map(cp=><td key={cp.id} style={tdS()}>{inp(cp.saleDate,v=>setCompField(cp.id,"saleDate",v),"m/d/y")}<div style={{fontSize:10,color:"var(--ink-2)",marginTop:2}}>${compPPSF(cp)}/sf</div></td>)}
              </tr>
              {b.rows.map(r=><tr key={r.key} style={{borderBottom:"1px solid var(--line)",verticalAlign:"top"}}>
                <td style={{...tdS({position:"sticky",left:0,background:"var(--surface-3)",color:"var(--ink-2)"})}}>{r.label}{r.kind==="category"&&<div style={{fontSize:9,color:"var(--accent)"}}>auto · {r.cat}</div>}</td>
                {/* subject cell */}
                <td style={tdS()}>{r.kind==="category"?<CatPicker who="subj" row={r}/>:inp(b.subj[r.key],v=>setSubj(r.key,v),r.num?"sqft":"value")}</td>
                {/* comp cells */}
                {b.comps.map(cp=>{
                  if(r.kind==="category"){
                    const auto=!(cp.adjAuto&&cp.adjAuto[r.key]===false);
                    const a=rowAdj(b,cp,r,adjLib);
                    return <td key={cp.id} style={tdS()}>
                      <CatPicker who={cp.id} row={r}/>
                      <div style={{marginTop:4,display:"flex",alignItems:"center",gap:4}}>
                        {auto
                          ? <><span style={{fontSize:11,fontWeight:600,color:a<0?"#dc2626":a>0?"#0f7a52":"var(--ink-2)"}}>{a<0?"":"+"}{fmt(a)}</span><button onClick={()=>setCompAdj(cp.id,r.key,a)} style={{...btnGhost,fontSize:9,padding:"1px 5px"}}>override</button></>
                          : <><input type="number" value={cp.adj[r.key]||""} onChange={e=>setCompAdj(cp.id,r.key,e.target.value)} style={{padding:"3px 6px",fontSize:11,borderRadius:5,border:"1px solid #d97706",background:"var(--surface)",color:(cp.adj[r.key]||0)<0?"#dc2626":"#0f7a52",width:80,fontFamily:SANS}}/><button onClick={()=>revertAuto(cp.id,r.key)} style={{...btnGhost,fontSize:9,padding:"1px 5px"}}>↻ auto</button></>}
                      </div>
                    </td>;
                  }
                  return <td key={cp.id} style={tdS()}>
                    {inp(cp.val[r.key],v=>setCompVal(cp.id,r.key,v),r.num?"sqft":"value")}
                    <div style={{marginTop:3}}><input type="number" value={cp.adj[r.key]||""} placeholder="adj $" onChange={e=>setCompAdj(cp.id,r.key,e.target.value)} style={{padding:"4px 7px",fontSize:11,borderRadius:5,border:"1px solid var(--line)",background:"var(--surface)",color:(cp.adj[r.key]||0)<0?"#dc2626":(cp.adj[r.key]||0)>0?"#0f7a52":"var(--ink)",fontFamily:SANS,width:"100%",boxSizing:"border-box"}}/></div>
                  </td>;
                })}
              </tr>)}
              <tr style={{borderTop:"1px solid var(--line)"}}>
                <td style={{...tdS({fontWeight:600,position:"sticky",left:0,background:"var(--surface-3)"})}}>Net Adjustment</td>
                <td style={tdS()}></td>
                {b.comps.map(cp=>{const n=netAdj(b,cp,adjLib);return <td key={cp.id} style={tdS({fontWeight:500,color:n<0?"#dc2626":"#0f7a52"})}>{n<0?"":"+"}{fmt(n)}</td>;})}
              </tr>
              <tr style={{background:"var(--surface)"}}>
                <td style={{...tdS({fontWeight:700,position:"sticky",left:0,background:"var(--surface)"})}}>Adjusted Price</td>
                <td style={tdS()}></td>
                {b.comps.map(cp=><td key={cp.id} style={tdS({fontWeight:700,color:"#0f7a52"})}>{fmt(adjustedPrice(b,cp,adjLib))}</td>)}
              </tr>
            </tbody>
          </table></div>
          <button onClick={addComp} style={{...btnGhost,marginTop:10}}>+ Add comp</button>
        </Section>

        {summary&&<div style={{padding:16,background:"var(--surface)",borderRadius:10,border:"1px solid var(--line-2)",marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:600,fontFamily:SANS,color:"var(--ink-2)",textTransform:"uppercase",marginBottom:10}}>Reconciliation · {summary.n} comps</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
            <Card l="Low" v={fmt(summary.low)}/><Card l="Median" v={fmt(summary.med)} accent="#0f7a52"/><Card l="Average" v={fmt(summary.avg)}/><Card l="High" v={fmt(summary.high)}/><Card l="Implied $/SF" v={summary.ppsf?`$${summary.ppsf}`:"—"}/>
          </div>
          {+b.listPrice>0&&<div style={{fontSize:12,color:"var(--ink-2)",fontFamily:SANS,marginTop:10}}>Median adjusted value is {summary.med>=+b.listPrice?"above":"below"} your list/target by {fmt(Math.abs(summary.med-(+b.listPrice)))} ({Math.round(Math.abs(summary.med-(+b.listPrice))/(+b.listPrice)*100)}%).</div>}
        </div>}
      </>

      <Section title="Notes">
        <textarea value={b.notes} onChange={e=>setB(p=>({...p,notes:e.target.value}))} placeholder="Market context, condition notes, recommended list price or offer strategy…" rows={4} style={{width:"100%",padding:"8px 10px",fontSize:13,borderRadius:8,border:"1px solid var(--line)",background:"var(--surface)",color:"var(--ink)",fontFamily:SANS,resize:"vertical",boxSizing:"border-box"}}/>
      </Section>

      <div style={{display:"flex",gap:8}}>
        <button onClick={saveCMA} style={{...btnPrimary,padding:"8px 18px",fontSize:13}}>{editId?"Save Changes":"Save CMA"}</button>
        <button onClick={()=>{setB(blank());setEditId(null);setTab("library");}} style={{...btnGhost,padding:"8px 16px"}}>Cancel</button>
      </div>
    </div>}

    {tab==="adj"&&<AdjustmentValues adjLib={adjLib} saveAdjLib={saveAdjLib} adjCats={adjCats} saveAdjCats={saveAdjCats}/>}

    {reportId&&<CmaReport cma={cmas.find(c=>c.id===reportId)} adjLib={adjLib} profile={profile} saveProfile={saveProfile} onClose={()=>setReportId(null)}/>}
  </div>;
}

// ──────────── CMA PDF / Print Report ────────────
// Document order: Cover Letter → CMA → Services Packet → Appendix.
// Each is one <section class="pdf-page"> and becomes exactly one PDF page.
function CmaReport({cma,adjLib,profile,saveProfile,onClose}) {
  const brands=brandList(profile);
  const [brandIx,setBrandIx]=useState(0);
  const [detail,setDetail]=useState("clean");  // clean | full
  const packets=servicePackets(profile);
  const [packetIx,setPacketIx]=useState(-1);
  const packet=packetIx>=0?packets[packetIx]:null;
  const [fontsReady,setFontsReady]=useState(false);
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const sheetRef=useRef(null);
  const FP=fontPair(profile);

  useEffect(()=>{
    let alive=true;
    if(!FP.g){ setFontsReady(true); return; }
    const id="hb-font-"+(profile.fontPair||"fraunces");
    if(!document.getElementById(id)){
      const l=document.createElement("link");
      l.id=id; l.rel="stylesheet";
      l.href=`https://fonts.googleapis.com/css2?family=${FP.g}&display=swap`;
      document.head.appendChild(l);
    }
    setFontsReady(false);
    const done=()=>{ if(alive) setFontsReady(true); };
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(done).catch(done); else setTimeout(done,1200);
    const t=setTimeout(done,4000);
    return ()=>{ alive=false; clearTimeout(t); };
  },[profile.fontPair]);

  if(!cma) return null;
  const rows=cmaRows(cma);
  const comps=activeComps(cma);
  const adj=comps.map(c=>adjustedPrice(cma,c,adjLib));
  const subjGla=parseFloat(cma.subj?.gla)||0;
  const med=median(adj), avg=adj.length?Math.round(adj.reduce((s,x)=>s+x,0)/adj.length):0;
  const low=adj.length?Math.min(...adj):0, high=adj.length?Math.max(...adj):0;
  const suggested = +cma.listPrice>0 ? +cma.listPrice : med;
  const ppsf=subjGla>0?Math.round(suggested/subjGla):0;

  const B=brands[Math.min(brandIx,brands.length-1)]||brands[0];
  const INK=B.ink||"var(--ink)", ACC=B.accent||"#a8813a", PAPER=B.paper||"#f7f5ef";
  const MUT="var(--ink-2)", RULE="var(--line-2)", GREEN="#0f7a52";
  const SER=FP.serif, SN=FP.sans;
  const brandName=B.name||"", tagline=B.tagline||"";
  const brokerage=profile.brokerage||profile.decaName||"";
  const logoDark=B.logo||"", logoLight=B.logoLight||B.logo||"";

  const letter=(profile.letterTemplate||"").trim()
    ? profile.letterTemplate.replace(/\{\{Client\}\}/g,cma.client||"there").replace(/\{\{Address\}\}/g,cma.subject||"your property").replace(/\{\{Price\}\}/g,fmt(suggested)).replace(/\{\{Agent\}\}/g,profile.agentName||"")
    : "";

  const barLo = adj.length?Math.min(low,suggested):0, barHi = adj.length?Math.max(high,suggested):0;
  const padR = (barHi-barLo)*0.12 || 1;
  const tLo = barLo-padR, tHi = barHi+padR;
  const pos = (v)=> tHi>tLo ? Math.max(0,Math.min(100,((v-tLo)/(tHi-tLo))*100)) : 50;

  const fileName=["CMA",String(cma.subject||"").replace(/[\\/:*?"<>|]+/g,"").trim(),String(cma.client||"").replace(/[\\/:*?"<>|]+/g,"").trim()].filter(Boolean).join(" - ")+".pdf";

  // ── true PDF export: capture each .pdf-page and place it on its own page ──
  const exportPdf=async()=>{
    setErr("");
    const H2C=window.html2canvas, JS=window.jspdf&&window.jspdf.jsPDF;
    if(!H2C||!JS){ setErr("PDF libraries didn't load. Check your connection and reload the page."); return; }
    const host=sheetRef.current;
    if(!host){ setErr("Nothing to export."); return; }
    const pages=[...host.querySelectorAll(".pdf-page")];
    if(!pages.length){ setErr("Nothing to export."); return; }
    try{
      if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
      const pdf=new JS({unit:"pt",format:"letter",orientation:"portrait",compress:true});
      const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
      for(let i=0;i<pages.length;i++){
        setBusy(`Rendering page ${i+1} of ${pages.length}…`);
        await new Promise(r=>setTimeout(r,30)); // let the label paint
        const canvas=await H2C(pages[i],{scale:2,backgroundColor:"#ffffff",useCORS:true,allowTaint:false,logging:false,imageTimeout:15000,scrollX:0,scrollY:0});
        const img=canvas.toDataURL("image/jpeg",0.92);
        const ratio=Math.min(pw/canvas.width, ph/canvas.height);
        const w=canvas.width*ratio, h=canvas.height*ratio;
        if(i) pdf.addPage();
        pdf.addImage(img,"JPEG",(pw-w)/2,0,w,h,undefined,"FAST");
      }
      setBusy("Saving…");
      pdf.save(fileName);
      setBusy("");
    }catch(e){
      setBusy("");
      const msg=String(e&&e.message||e);
      if(/taint|cross-origin|SecurityError/i.test(msg)){
        setErr("The cover photo is hosted somewhere that blocks copying, so it can't go into the PDF. Upload the photo instead of using a link (Edit CMA → Cover photo → Upload).");
      } else {
        setErr("PDF export failed: "+msg);
      }
    }
  };

  const doPrint=()=>{
    const prev=document.title;
    const go=()=>{
      document.title=fileName.replace(/\.pdf$/,"")||prev;
      const restore=()=>{ document.title=prev; window.removeEventListener("afterprint",restore); };
      window.addEventListener("afterprint",restore);
      setTimeout(restore,120000);
      window.print();
    };
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(go).catch(go); else go();
  };

  const th={textAlign:"left",padding:"8px 9px",fontSize:9,color:MUT,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",borderBottom:`1.5px solid ${INK}`,fontFamily:SN,whiteSpace:"nowrap"};
  const td=(e={})=>({padding:"9px 9px",fontFamily:SN,fontSize:11.5,borderBottom:`1px solid #ebe8e0`,fontVariantNumeric:"tabular-nums",...e});
  const gth={textAlign:"left",padding:"7px 8px",fontSize:9.5,color:MUT,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",borderBottom:`2px solid ${INK}`,background:PAPER,fontFamily:SN};
  const gtd=(e={})=>({padding:"7px 8px",fontFamily:SN,fontSize:11.5,borderBottom:`1px solid #e7e4dc`,fontVariantNumeric:"tabular-nums",...e});
  const secHead=(t)=>(<div style={{fontSize:10,fontFamily:SN,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.14em",color:ACC,borderBottom:`1px solid ${RULE}`,paddingBottom:6,margin:"22px 0 11px"}}>{t}</div>);
  const ctrlBtn=(on,dis)=>({fontSize:12,padding:"5px 12px",border:`1px solid ${on?"var(--ink-2)":"var(--line-2)"}`,background:on?"var(--ink-2)":"#fff",color:on?"#fff":"var(--ink-2)",cursor:dis?"default":"pointer",fontFamily:SANS,fontWeight:on?600:500,borderRadius:4,opacity:dis?0.55:1});
  const fInp=(v,set,ph)=>(<input value={v||""} onChange={e=>set(e.target.value)} placeholder={ph} style={{padding:"5px 8px",fontSize:12,border:"1px solid var(--line-2)",borderRadius:4,fontFamily:SANS,width:"100%",boxSizing:"border-box"}}/>);
  const setP=(k,v)=>saveProfile({...profile,[k]:v});

  // page shell: fixed 8.5x11 aspect so what you see is exactly one PDF page
  const PAGE_W=816, PAGE_H=1056, PAD=52;
  const pageStyle=(extra={})=>({width:PAGE_W,minHeight:PAGE_H,height:PAGE_H,boxSizing:"border-box",background:"#fff",position:"relative",overflow:"hidden",display:"flex",flexDirection:"column",...extra});

  const signatureBlock=(<div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",fontFamily:SN,gap:20}}>
    <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
      {profile.headshot&&<img src={profile.headshot} alt="" style={{width:56,height:56,objectFit:"cover",borderRadius:"50%",flexShrink:0}}/>}
      <div>
        {profile.signature&&<img src={profile.signature} alt="" style={{height:32,objectFit:"contain",display:"block",marginBottom:3}}/>}
        <div style={{fontSize:13.5,fontWeight:700,color:INK}}>{profile.agentName}</div>
        <div style={{fontSize:10.5,color:MUT}}>{profile.title}{profile.license?` · Lic. ${profile.license}`:""}</div>
        <div style={{fontSize:10.5,color:MUT}}>{[profile.phone,profile.email].filter(Boolean).join("  ·  ")}</div>
        <div style={{fontSize:10.5,color:MUT,marginTop:2}}>{[brandName,brokerage].filter(Boolean).join(" · ")}</div>
      </div>
    </div>
    <div style={{fontSize:8,color:"var(--ink-3)",textAlign:"right",maxWidth:260,lineHeight:1.45}}>Comparable values are adjusted estimates prepared for informational purposes and do not constitute a formal appraisal.{brokerage?` Brokerage: ${brokerage}.`:""}</div>
  </div>);

  const wordmark=(light)=>{
    const src=light?logoLight:logoDark;
    if(src) return <img src={src} alt={brandName} style={{height:light?30:26,objectFit:"contain",display:"block"}}/>;
    return <div style={{display:"flex",alignItems:"center",gap:7}}>
      <div style={{width:light?22:20,height:light?22:20,border:`1px solid ${light?ACC:INK}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        <span style={{fontFamily:SER,fontSize:light?11:10,color:light?ACC:INK,lineHeight:1}}>{(brandName||"L").trim().charAt(0).toUpperCase()}</span>
      </div>
      <span style={{fontSize:light?9:8.5,letterSpacing:"0.2em",textTransform:"uppercase",color:light?ACC:INK,fontFamily:SN,fontWeight:600}}>{brandName}</span>
    </div>;
  };

  const pageHeader=(right)=>(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:11,borderBottom:`1px solid ${RULE}`,marginBottom:20,flexShrink:0}}>
    {wordmark(false)}
    <div style={{fontSize:9,color:MUT,fontFamily:SN,textTransform:"uppercase",letterSpacing:"0.12em"}}>{right}</div>
  </div>);

  const pageFooter=(<div style={{marginTop:"auto",paddingTop:10,borderTop:`1px solid ${RULE}`,display:"flex",justifyContent:"space-between",fontFamily:SN,fontSize:7.5,color:MUT,letterSpacing:"0.06em",textTransform:"uppercase",flexShrink:0}}>
    <span>{[brandName,brokerage].filter(Boolean).join(" · ")}</span>
    <span>{cma.subject}</span>
  </div>);

  return ReactDOM.createPortal(<div className="cma-print-root" style={{position:"fixed",inset:0,zIndex:9999,background:"#e7e6e1",overflow:"auto"}}>
    <style>{`@media print{
      .no-print{display:none !important;}
      html,body{background:#fff !important;margin:0 !important;padding:0 !important;height:auto !important;}
      body > *:not(.cma-print-root){display:none !important;}
      .cma-print-root{position:static !important;inset:auto !important;height:auto !important;background:#fff !important;overflow:visible !important;z-index:auto !important;}
      .cma-print-root *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
      .cma-sheet{box-shadow:none !important;margin:0 !important;gap:0 !important;}
      .pdf-page{box-shadow:none !important;margin:0 !important;width:100% !important;height:auto !important;min-height:0 !important;}
      .pdf-page + .pdf-page{break-before:page !important;page-break-before:always !important;}
      @page{size:letter;margin:0.42in;}
    }`}</style>

    {/* control bar */}
    <div className="no-print" style={{position:"sticky",top:0,zIndex:2,background:"#fff",borderBottom:"1px solid var(--line-2)",padding:"10px 16px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:MUT,fontFamily:SANS,fontWeight:600}}>Brand</span>
        {brands.map((b,i)=><button key={b.id||i} onClick={()=>setBrandIx(i)} style={ctrlBtn(brandIx===i)}>{b.name||`Brand ${i+1}`}</button>)}</div>
      <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:MUT,fontFamily:SANS,fontWeight:600}}>Detail</span>
        <button onClick={()=>setDetail("clean")} style={ctrlBtn(detail==="clean")}>Client-clean</button>
        <button onClick={()=>setDetail("full")} style={ctrlBtn(detail==="full")}>+ Adjustment grid</button></div>
      {packets.length>0&&<div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:MUT,fontFamily:SANS,fontWeight:600}}>Services</span>
        <button onClick={()=>setPacketIx(-1)} style={ctrlBtn(packetIx===-1)}>None</button>
        {packets.map((p,i)=><button key={p.id||i} onClick={()=>setPacketIx(i)} style={ctrlBtn(packetIx===i)}>{p.name||`Packet ${i+1}`}</button>)}</div>}
      <div style={{display:"flex",gap:6,marginLeft:"auto",alignItems:"center"}}>
        {!fontsReady&&<span style={{fontSize:10.5,color:MUT,fontFamily:SANS}}>Loading type…</span>}
        {busy&&<span style={{fontSize:11,color:INK,fontFamily:SANS,fontWeight:600}}>{busy}</span>}
        <button onClick={exportPdf} disabled={!!busy} style={{...ctrlBtn(true,!!busy),padding:"7px 16px"}}>{busy?"Working…":"Download PDF"}</button>
        <button onClick={doPrint} disabled={!!busy} title="Opens the browser print dialog instead" style={ctrlBtn(false,!!busy)}>Print</button>
        <button onClick={onClose} style={ctrlBtn(false)}>Close</button>
      </div>
      {err&&<div style={{flexBasis:"100%",fontSize:11.5,color:"#b3392c",fontFamily:SANS,lineHeight:1.5,background:"#fcf0ee",border:"1px solid #f0d5d0",borderRadius:5,padding:"7px 10px"}}>{err}</div>}
    </div>
    {/* footer-info editors */}
    <div className="no-print" style={{background:"#fff",borderBottom:"1px solid var(--line)",padding:"10px 16px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,maxWidth:PAGE_W,margin:"0 auto"}}>
      {fInp(profile.agentName,v=>setP("agentName",v),"Your name")}
      {fInp(profile.license,v=>setP("license",v),"License #")}
      {fInp(profile.phone,v=>setP("phone",v),"Phone")}
      {fInp(profile.email,v=>setP("email",v),"Email")}
    </div>

    {/* the document — one .pdf-page per printed page */}
    <div className="cma-sheet" ref={sheetRef} style={{width:PAGE_W,margin:"18px auto 40px",display:"flex",flexDirection:"column",gap:18,fontFamily:SER,color:INK}}>

      {/* ── PAGE: COVER LETTER ── */}
      {letter&&<section className="pdf-page" data-pdf-page="letter" style={pageStyle({padding:PAD,boxShadow:"0 2px 14px rgba(0,0,0,0.12)"})}>
        {pageHeader(cma.date)}
        <div style={{fontSize:9.5,textTransform:"uppercase",letterSpacing:"0.18em",color:ACC,fontFamily:SN,fontWeight:700,marginBottom:16}}>{cma.subject}</div>
        <div style={{fontSize:13.5,lineHeight:1.9,whiteSpace:"pre-wrap",maxWidth:600}}>{letter}</div>
        <div style={{marginTop:32}}>{signatureBlock}</div>
        {pageFooter}
      </section>}

      {/* ── PAGE: CMA ── */}
      <section className="pdf-page" data-pdf-page="cma" style={pageStyle({boxShadow:"0 2px 14px rgba(0,0,0,0.12)"})}>
        {/* full-bleed cover band */}
        <div style={{position:"relative",background:INK,height:cma.heroPhoto?240:150,flexShrink:0,display:"flex",flexDirection:"column",justifyContent:"space-between",overflow:"hidden"}}>
          {cma.heroPhoto&&<img src={cma.heroPhoto} crossOrigin="anonymous" alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>}
          {cma.heroPhoto&&<div style={{position:"absolute",inset:0,background:INK,opacity:0.62}}/>}
          <div style={{position:"relative",display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:`22px ${PAD}px 0`}}>
            {wordmark(true)}
            <div style={{textAlign:"right",fontFamily:SN}}>
              <div style={{fontSize:8.5,textTransform:"uppercase",letterSpacing:"0.2em",color:ACC,fontWeight:600}}>Comparative Market Analysis</div>
              <div style={{fontSize:10,color:"#d8d4cc",marginTop:3}}>{cma.date}</div>
            </div>
          </div>
          <div style={{position:"relative",padding:`0 ${PAD}px 22px`}}>
            <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:"0.2em",color:ACC,fontFamily:SN,fontWeight:600,marginBottom:5}}>Prepared exclusively for {cma.client||"you"}</div>
            <div style={{fontSize:34,fontWeight:700,color:"#fff",lineHeight:1.08,letterSpacing:"-0.5px"}}>{cma.subject}</div>
            <div style={{fontSize:12,color:"#d8d4cc",fontFamily:SN,marginTop:4}}>{cma.zip?`St. Louis, Missouri ${cma.zip}`:""}</div>
          </div>
        </div>

        <div style={{padding:`22px ${PAD}px ${PAD}px`,display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
          {/* headline valuation */}
          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:24,flexWrap:"wrap",flexShrink:0}}>
            <div>
              <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:"0.18em",color:ACC,fontFamily:SN,fontWeight:700}}>Recommended List Price</div>
              <div style={{fontSize:46,fontWeight:700,color:INK,lineHeight:1.02,letterSpacing:"-1.4px",fontVariantNumeric:"tabular-nums",marginTop:5}}>{fmt(suggested)}</div>
            </div>
            <div style={{display:"flex",gap:22,fontFamily:SN,paddingBottom:6}}>
              {[["Supported Range",adj.length?`${fmtS(low)} – ${fmtS(high)}`:"—"],["Implied $/SF",ppsf?`$${ppsf}`:"—"],["Comparables",String(comps.length)]].map(([l,v],i)=>
                <div key={i}>
                  <div style={{fontSize:8.5,textTransform:"uppercase",letterSpacing:"0.1em",color:MUT,fontWeight:700}}>{l}</div>
                  <div style={{fontSize:16,fontWeight:700,color:INK,fontVariantNumeric:"tabular-nums",marginTop:2}}>{v}</div>
                </div>)}
            </div>
          </div>

          {adj.length>0&&<div style={{marginTop:20,flexShrink:0}}>
            <div style={{position:"relative",height:28}}>
              <div style={{position:"absolute",left:`${pos(suggested)}%`,top:0,transform:"translateX(-50%)",whiteSpace:"nowrap"}}>
                <div style={{fontSize:8.5,fontFamily:SN,fontWeight:700,color:INK,textAlign:"center",letterSpacing:"0.1em"}}>RECOMMENDED</div>
                <div style={{width:2,height:9,background:INK,margin:"3px auto 0"}}/>
              </div>
            </div>
            <div style={{position:"relative",height:11,background:PAPER,border:`1px solid ${RULE}`}}>

// ──────────── Adjustment Values warehouse ────────────
function AdjustmentValues({adjLib,saveAdjLib,adjCats,saveAdjCats}) {
  const [edit,setEdit]=useState(null);const [ed,setEd]=useState({});
  const [showAdd,setShowAdd]=useState(false);
  const [showCat,setShowCat]=useState(false);
  const [newCat,setNewCat]=useState("");
  // full category list = persisted cats + any orphan cats found on values
  const cats=useMemo(()=>{
    const seen=new Set();const out=[];
    [...adjCats,...adjLib.map(a=>a.cat||"Other")].forEach(c=>{if(c&&!seen.has(c)){seen.add(c);out.push(c);}});
    return out;
  },[adjCats,adjLib]);
  const [n,setN]=useState({name:"",value:"",cat:cats[0]||"Outdoor"});
  const grouped=useMemo(()=>{const m={};cats.forEach(c=>m[c]=[]);adjLib.forEach(a=>{const c=a.cat||"Other";(m[c]=m[c]||[]).push(a);});return m;},[adjLib,cats]);

  const add=()=>{if(!n.name)return;saveAdjLib([...adjLib,{...n,id:uid(),value:+n.value||0}]);setN({name:"",value:"",cat:n.cat});setShowAdd(false);};
  const save=()=>{saveAdjLib(adjLib.map(a=>a.id===edit?{...ed,value:+ed.value||0}:a));setEdit(null);};
  const del=(id)=>{if(confirm("Delete this adjustment value?"))saveAdjLib(adjLib.filter(a=>a.id!==id));};

  const addCat=()=>{
    const name=newCat.trim();
    if(!name) return;
    if(cats.some(c=>c.toLowerCase()===name.toLowerCase())){alert("That category already exists.");return;}
    saveAdjCats([...adjCats,name]);
    setNewCat("");setShowCat(false);setN(p=>({...p,cat:name}));
  };
  const delCat=(cat)=>{
    const count=(grouped[cat]||[]).length;
    if(count>0){ if(!confirm(`"${cat}" has ${count} value(s). Delete the category and all its values?`)) return; saveAdjLib(adjLib.filter(a=>(a.cat||"Other")!==cat)); }
    else { if(!confirm(`Delete the empty category "${cat}"?`)) return; }
    saveAdjCats(adjCats.filter(c=>c!==cat));
  };

  return <div>
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{fontSize:13,color:"var(--ink-2)",fontFamily:SANS,maxWidth:560,lineHeight:1.5}}>Your reusable feature adjustment values, grouped by category. Each category becomes a selectable, auto-calculating row in the CMA grid. Positive = feature adds value; the grid computes adjustments as subject value minus comp value.</div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>{setShowCat(!showCat);setShowAdd(false);}} style={{...btnGhost,padding:"7px 14px",background:showCat?"var(--accent)":"var(--surface-3)",color:showCat?"#fff":"var(--ink)"}}>+ Category</button>
        <button onClick={()=>{setShowAdd(!showAdd);setShowCat(false);}} style={{...btnGhost,padding:"7px 14px",background:showAdd?"var(--accent)":"var(--surface-3)",color:showAdd?"#fff":"var(--ink)"}}>+ Value</button>
      </div>
    </div>

    {showCat&&<div style={{background:"var(--surface-3)",borderRadius:10,padding:14,marginBottom:16,border:"1px solid var(--line)"}}>
      <div style={{fontSize:12,fontWeight:600,fontFamily:SANS,color:"var(--ink)",marginBottom:8}}>New category</div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}>{inp(newCat,setNewCat,"Category name (e.g. HVAC, Lot Size, Interior)")}</div>
        <button onClick={addCat} style={btnPrimary}>Add Category</button>
        <button onClick={()=>setShowCat(false)} style={btnGhost}>Cancel</button>
      </div>
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:8}}>New categories appear immediately as a toggleable, auto-calculating row in the CMA grid — even before you add any values to them.</div>
    </div>}

    {showAdd&&<div style={{background:"var(--surface-3)",borderRadius:10,padding:14,marginBottom:16,border:"1px solid var(--line)"}}>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:8,marginBottom:10}}>
        <div>{inp(n.name,v=>setN(p=>({...p,name:v})),"Feature name (e.g. Sunroom)")}</div>
        <div>{inp(n.value,v=>setN(p=>({...p,value:v})),"Value $","number")}</div>
        <div>{sel(n.cat,v=>setN(p=>({...p,cat:v})),cats)}</div>
      </div>
      <div style={{display:"flex",gap:8}}><button onClick={add} style={btnPrimary}>Add Value</button><button onClick={()=>setShowAdd(false)} style={btnGhost}>Cancel</button></div>
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
      {cats.map(cat=><div key={cat} style={{background:"var(--surface-3)",borderRadius:10,padding:14}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <span style={{fontSize:11,fontWeight:600,fontFamily:SANS,color:"var(--ink)",textTransform:"uppercase",letterSpacing:"0.04em"}}>{cat} <span style={{color:"var(--ink-2)",fontWeight:400}}>({(grouped[cat]||[]).length})</span></span>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>{setN(p=>({...p,cat}));setShowAdd(true);setShowCat(false);}} style={{...btnGhost,fontSize:10,padding:"2px 7px"}} title="Add value here">+</button>
            <button onClick={()=>delCat(cat)} style={{...btnGhost,fontSize:10,padding:"2px 6px",color:"#b3392c"}} title="Delete category">×</button>
          </div>
        </div>
        {(grouped[cat]||[]).length===0
          ? <div style={{fontSize:11,color:"var(--ink-3)",fontFamily:SANS,padding:"4px 0"}}>No values yet — click + to add one.</div>
          : <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>
            {grouped[cat].map(a=><tr key={a.id} style={{borderBottom:"1px solid var(--line)"}}>
              {edit===a.id?<>
                <td style={tdS()}>{inp(ed.name,v=>setEd(p=>({...p,name:v})),"Name")}</td>
                <td style={tdS({width:80})}>{inp(ed.value,v=>setEd(p=>({...p,value:v})),"$","number")}</td>
                <td style={tdS({width:60,textAlign:"right"})}><div style={{display:"flex",gap:3,justifyContent:"flex-end"}}><button onClick={save} style={{...btnPrimary,fontSize:10,padding:"3px 7px"}}>✓</button><button onClick={()=>setEdit(null)} style={{...btnGhost,fontSize:10,padding:"3px 6px"}}>×</button></div></td>
              </>:<>
                <td style={tdS({fontWeight:500})}>{a.name}</td>
                <td style={tdS({textAlign:"right",fontWeight:600,color:a.value<0?"#dc2626":a.value>0?"#0f7a52":"var(--ink-2)"})}>{fmt(a.value)}</td>
                <td style={tdS({width:56,textAlign:"right"})}><div style={{display:"flex",gap:3,justifyContent:"flex-end"}}><button onClick={()=>{setEdit(a.id);setEd({...a});}} style={{...btnGhost,fontSize:10,padding:"3px 6px"}}>✎</button><button onClick={()=>del(a.id)} style={{...btnGhost,fontSize:10,padding:"3px 5px",color:"#b3392c"}}>×</button></div></td>
              </>}
            </tr>)}
          </tbody></table>}
      </div>)}
    </div>
  </div>;
}

function MyCRM({contacts,saveContacts,addrOptions}) {
  const S=useSettings();

  const CTYPES=names(S.crmTypes); const typeColors=colorMap(S.crmTypes);

  const [stageFilter,setStageFilter]=useState("All");
  const [search,setSearch]=useState("");
  const [open,setOpen]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const blank={name:"",type:"Buyer",stage:"Lead",email:"",phone:"",linkedAddr:"",notes:"",lastTouch:"",nextFollowUp:""};
  const [n,setN]=useState(blank);
  const [editId,setEditId]=useState(null);
  const [ed,setEd]=useState({});
  const [dragId,setDragId]=useState(null);

  const filtered=useMemo(()=>{
    let rows=[...contacts];
    if(typeFilter!=="All")rows=rows.filter(c=>c.type===typeFilter);
    if(stageFilter!=="All")rows=rows.filter(c=>c.stage===stageFilter);
    if(search){const q=search.toLowerCase();rows=rows.filter(c=>c.name.toLowerCase().includes(q)||(c.notes||"").toLowerCase().includes(q)||(c.linkedAddr||"").toLowerCase().includes(q));}
    return rows;
  },[contacts,typeFilter,stageFilter,search]);

  const stats=useMemo(()=>({total:contacts.length,active:contacts.filter(c=>["Active","Under Contract"].includes(c.stage)).length,leads:contacts.filter(c=>c.stage==="Lead").length,closed:contacts.filter(c=>c.stage==="Closed").length}),[contacts]);

  const addContact=()=>{if(!n.name)return;saveContacts([{...n,id:uid()},...contacts]);setN(blank);setShowAdd(false);};
  const delContact=(id)=>{if(confirm("Delete this contact?")){saveContacts(contacts.filter(c=>c.id!==id));setOpen(null);}};
  const saveEdit=()=>{saveContacts(contacts.map(c=>c.id===editId?ed:c));setEditId(null);setOpen(null);};
  const moveStage=(id,stage)=>saveContacts(contacts.map(c=>c.id===id?{...c,stage}:c));

  const onDrop=(stage)=>{if(dragId){moveStage(dragId,stage);setDragId(null);}};

  const openC=open?contacts.find(c=>c.id===open):null;
  const initials=(name)=>name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

  return <div>
    <div className="hb-grid-4" style={{marginBottom:18}}>
      <Card l="Total Contacts" v={String(stats.total)}/><Card l="Active Clients" v={String(stats.active)} accent="var(--accent)"/><Card l="New Leads" v={String(stats.leads)} accent="#d97706"/><Card l="Closed" v={String(stats.closed)} accent="#0f7a52"/>
    </div>

    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      <div style={{display:"flex",gap:4,background:"var(--surface-3)",borderRadius:8,padding:3}}>

// ──────────── Settings ────────────
function ListEditor({title, hint, list, onChange}) {
  const set=(i,patch)=>onChange(list.map((it,j)=>j===i?{...it,...patch}:it));
  const move=(i,d)=>{const j=i+d; if(j<0||j>=list.length)return; const a=[...list]; [a[i],a[j]]=[a[j],a[i]]; onChange(a);};
  const del=(i)=>{ if(confirm(`Remove "${list[i].name}"? Existing records keep this label until you re-tag them.`)) onChange(list.filter((_,j)=>j!==i)); };
  const add=()=>onChange([...list,{name:"New "+title.replace(/s$/,""),...PALETTE[list.length%PALETTE.length]}]);
  return <Section title={title}>
    {hint&&<div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:10}}>{hint}</div>}
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {list.map((it,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <div style={{display:"flex",flexDirection:"column",gap:0}}>
          <button onClick={()=>move(i,-1)} disabled={i===0} title="Move up" style={{...btnGhost,padding:"0 6px",fontSize:10,lineHeight:1.4,opacity:i===0?0.3:1}}>▲</button>
          <button onClick={()=>move(i,1)} disabled={i===list.length-1} title="Move down" style={{...btnGhost,padding:"0 6px",fontSize:10,lineHeight:1.4,opacity:i===list.length-1?0.3:1}}>▼</button>
        </div>
        <input value={it.name} onChange={e=>set(i,{name:e.target.value})} style={{padding:"6px 9px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,minWidth:150}}/>
        <Pill color={{bg:it.bg,text:it.text}}>{it.name||"—"}</Pill>
        <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{PALETTE.map((p,pi)=><button key={pi} onClick={()=>set(i,{bg:p.bg,text:p.text})} title="Set color" style={{width:18,height:18,borderRadius:4,border:it.bg===p.bg?"2px solid var(--ink)":"1px solid var(--line-2)",background:p.bg,cursor:"pointer",padding:0}}/>)}</div>
        <button onClick={()=>del(i)} title="Remove" style={{...btnGhost,padding:"4px 8px",color:"#b3392c",marginLeft:"auto"}}>×</button>
      </div>)}
    </div>
    <button onClick={add} style={{...btnGhost,marginTop:10}}>+ Add</button>
  </Section>;
}

// Stable module-level field wrapper (defining this inside Settings remounts inputs and drops focus on each keystroke)
const Field = ({label,children}) => (<div><div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:3}}>{label}</div>{children}</div>);

// Upload → downscale → data URL. Stored inline so nothing needs external hosting.
function ImagePicker({label,hint,value,onChange,maxW=600,quality=0.85,boxH=64,dark=false}){
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const ref=useRef(null);
  const pick=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setErr(""); setBusy(true);
    try{ onChange(await readImageScaled(f,maxW,quality)); }
    catch(ex){ setErr(ex.message||"Upload failed."); }
    finally{ setBusy(false); if(ref.current) ref.current.value=""; }
  };
  return <div>
    <div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:3}}>{label}</div>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:boxH*1.9,height:boxH,border:"1px solid var(--line-2)",borderRadius:6,background:dark?"#2f3034":"#fff",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
        {value
          ? <img src={value} alt="" style={{maxWidth:"92%",maxHeight:"88%",objectFit:"contain"}}/>
          : <span style={{fontSize:10,color:"var(--ink-3)",fontFamily:SANS}}>None</span>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:5,minWidth:0}}>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>ref.current&&ref.current.click()} disabled={busy} style={{...btnGhost,padding:"5px 11px",opacity:busy?0.6:1}}>{busy?"Working…":(value?"Replace":"Upload")}</button>
          {value&&<button onClick={()=>{setErr("");onChange("");}} style={{...btnGhost,padding:"5px 9px",color:"#b3392c"}}>Remove</button>}
        </div>
        <div style={{fontSize:10,color:err?"#b3392c":"var(--ink-2)",fontFamily:SANS,lineHeight:1.4}}>
          {err||(value?`Stored · ~${dataUrlKB(value)} KB`:(hint||"PNG or JPG"))}
        </div>
      </div>
      <input ref={ref} type="file" accept="image/*" onChange={pick} style={{display:"none"}}/>
    </div>
  </div>;
}

const svcIn=(val,on,ph,extra={})=>(<input value={val||""} onChange={e=>on(e.target.value)} placeholder={ph} style={{padding:"6px 9px",fontSize:12.5,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box",...extra}}/>);
const svcArea=(val,on,ph,rows=3)=>(<textarea value={val||""} onChange={e=>on(e.target.value)} placeholder={ph} rows={rows} style={{padding:"8px 9px",fontSize:12.5,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box",lineHeight:1.55,resize:"vertical"}}/>);

function ServicePackets({profile,saveProfile}){
  const packets=servicePackets(profile);
  const [ix,setIx]=useState(0);
  const i0=Math.max(0,Math.min(ix,packets.length-1));
  const cur=packets[i0];
  const write=(next)=>saveProfile({...profile,servicePackets:next});
  const patch=(p)=>write(packets.map((x,j)=>j===i0?{...x,...p}:x));
  const setGroup=(gi,p)=>patch({groups:(cur.groups||[]).map((g,j)=>j===gi?{...g,...p}:g)});
  const setItem=(gi,ii,p)=>setGroup(gi,{items:(cur.groups[gi].items||[]).map((it,j)=>j===ii?{...it,...p}:it)});
  const addItem=(gi)=>setGroup(gi,{items:[...(cur.groups[gi].items||[]),{id:uid(),name:"",desc:""}]});
  const delItem=(gi,ii)=>setGroup(gi,{items:cur.groups[gi].items.filter((_,j)=>j!==ii)});
  const addGroup=()=>patch({groups:[...(cur.groups||[]),{id:uid(),title:"New section",items:[{id:uid(),name:"",desc:""}]}]});
  const delGroup=(gi)=>{ if(confirm("Delete this section and everything in it?")) patch({groups:cur.groups.filter((_,j)=>j!==gi)}); };
  const addPacket=()=>{ write([...packets,{id:uid(),name:"New packet",intro:"",footnote:"",groups:[{id:uid(),title:"New section",items:[{id:uid(),name:"",desc:""}]}]}]); setIx(packets.length); };
  const delPacket=()=>{ if(packets.length<2){alert("Keep at least one packet. Edit this one instead.");return;} if(confirm(`Delete the "${cur.name}" packet?`)){ write(packets.filter((_,j)=>j!==i0)); setIx(0); } };

  if(!cur) return <div style={{fontSize:12,color:"var(--ink-2)",fontFamily:SANS}}>No packets. <button onClick={addPacket} style={btnGhost}>+ Add one</button></div>;

  return <>
    <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:12,lineHeight:1.5}}>An optional back section for the CMA describing what the client gets when they sign with you. Pick which packet to include (or none) from the report toolbar. Two are pre-written below — edit them to match how you actually work.</div>

    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      {packets.map((p,i)=><button key={p.id||i} onClick={()=>setIx(i)} style={{...btnGhost,background:i===ix?"var(--ink-2)":"#fff",color:i===ix?"#fff":"var(--ink-2)",border:`1px solid ${i===ix?"var(--ink-2)":"var(--line-2)"}`,fontWeight:i===ix?600:500}}>{p.name||`Packet ${i+1}`}</button>)}
      <button onClick={addPacket} style={{...btnGhost,marginLeft:4}}>+ Packet</button>
      <button onClick={delPacket} style={{...btnGhost,color:"#b3392c"}}>Delete</button>
    </div>

    <div style={{border:"1px solid var(--line)",borderRadius:8,padding:12,background:"#fff",marginBottom:12}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:12}}>
        <Field label="Packet name">{svcIn(cur.name,v=>patch({name:v}),"Seller Representation")}</Field>
        <Field label="Page heading shown to client">{svcIn(cur.heading,v=>patch({heading:v}),"Defaults to the packet name")}</Field>
      </div>
      <Field label="Opening paragraph">{svcArea(cur.intro,v=>patch({intro:v}),"One short paragraph framing the list below.",3)}</Field>
      <div style={{marginTop:12}}><Field label="Footnote / compensation disclosure">{svcArea(cur.footnote,v=>patch({footnote:v}),"Printed small at the bottom of the packet.",3)}</Field></div>
    </div>

    {(cur.groups||[]).map((g,gi)=><div key={g.id||gi} style={{border:"1px solid var(--line)",borderRadius:8,padding:12,background:"#fff",marginBottom:10}}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
        <div style={{flex:1}}>{svcIn(g.title,v=>setGroup(gi,{title:v}),"Section title",{fontWeight:600})}</div>
        <button onClick={()=>delGroup(gi)} title="Delete section" style={{...btnGhost,color:"#b3392c",padding:"5px 9px"}}>×</button>
      </div>
      {(g.items||[]).map((it,ii)=><div key={it.id||ii} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:7}}>
        <div style={{width:"32%",flexShrink:0}}>{svcIn(it.name,v=>setItem(gi,ii,{name:v}),"Service name")}</div>
        <div style={{flex:1}}>{svcIn(it.desc,v=>setItem(gi,ii,{desc:v}),"One line describing it")}</div>
        <button onClick={()=>delItem(gi,ii)} title="Remove" style={{...btnGhost,padding:"5px 8px",color:"#b3392c"}}>×</button>
      </div>)}
      <button onClick={()=>addItem(gi)} style={{...btnGhost,marginTop:4,fontSize:11.5}}>+ Service</button>
    </div>)}
    <button onClick={addGroup} style={btnGhost}>+ Section</button>
  </>;
}

function BrandKit({profile,saveProfile}){
  const setP=(k,v)=>saveProfile({...profile,[k]:v});
  const brands=brandList(profile);
  const setBrand=(i,patch)=>{ const next=brands.map((b,j)=>j===i?{...b,...patch}:b); saveProfile({...profile,brands:next}); };
  const txtIn=(val,on,ph)=>(<input value={val||""} onChange={e=>on(e.target.value)} placeholder={ph} style={{padding:"7px 9px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box"}}/>);
  const colorIn=(val,on)=>(<div style={{display:"flex",gap:6,alignItems:"center"}}>
    <input type="color" value={val||"var(--ink)"} onChange={e=>on(e.target.value)} style={{width:34,height:30,padding:0,border:"1px solid var(--line-2)",borderRadius:6,background:"#fff",cursor:"pointer",flexShrink:0}}/>

      {b.logo&&<div style={{marginTop:8}}><ImagePicker label="Logo — reversed (for the dark cover)" hint="Optional. White/light version. Falls back to the logo above." value={b.logoLight} onChange={v=>setBrand(i,{logoLight:v})} maxW={600} boxH={58} dark/></div>}

        <Field label="Report typeface">

      </div>
    </div>

    <div style={{border:"1px solid var(--line)",borderRadius:8,padding:12,background:"#fff"}}>
      <div style={{fontSize:12,fontWeight:700,fontFamily:SANS,marginBottom:6,color:"var(--ink)"}}>Cover letter</div>
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:8,lineHeight:1.5}}>Optional. When filled in, the CMA prints a personal letter page ahead of the numbers. Use <code>{`{{Client}}`}</code>, <code>{`{{Address}}`}</code>, <code>{`{{Price}}`}</code>, and <code>{`{{Agent}}`}</code> — they fill in per CMA. Leave blank to skip the page entirely.</div>
      <textarea value={profile.letterTemplate||""} onChange={e=>setP("letterTemplate",e.target.value)} rows={7} placeholder={"Dear {{Client}},\n\nThank you for the opportunity to review {{Address}}. The analysis that follows reflects…"} style={{padding:"9px 10px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box",lineHeight:1.6,resize:"vertical"}}/>

  </>;
}

function Settings({settings, saveSettings, profile, saveProfile, stores}) {
  const [tab,setTab]=useState("profile");
  const s=settings||SEED_SETTINGS;
  const comm=s.comm||COMM;
  const setComm=(k,v)=>saveSettings({...s,comm:{...comm,[k]:v}});
  const setList=(k,list)=>saveSettings({...s,[k]:list});
  const setP=(k,v)=>saveProfile({...profile,[k]:v});
  const fileRef=useRef(null);
  const [tplOpen,setTplOpen]=useState(false);
  const [tplInit,setTplInit]=useState(null);
  const tpls=s.emailTemplates||[];
  const setTpls=(list)=>saveSettings({...s,emailTemplates:list});
  const saveTpl=(t)=>{ const list=tpls.some(x=>x.id===t.id)?tpls.map(x=>x.id===t.id?t:x):[...tpls,t]; setTpls(list); setTplOpen(false); };
  const delTpl=(id)=>{ if(confirm("Delete this template?")) setTpls(tpls.filter(x=>x.id!==id)); };

  const numIn=(val,on,style={})=>(<input type="number" value={val} onChange={e=>on(e.target.value)} style={{padding:"7px 9px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box",...style}}/>);
  const txtIn=(val,on,ph)=>(<input value={val||""} onChange={e=>on(e.target.value)} placeholder={ph} style={{padding:"7px 9px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS,width:"100%",boxSizing:"border-box"}}/>);

  const exportJSON=()=>{
    const data={hb_hist_v1:stores.hist,hb_esc_v2:stores.escrow,hb_cma_v4:stores.cmas,hb_adj_v1:stores.adjLib,hb_adjcats_v1:stores.adjCats,hb_profile_v1:stores.profile,hb_crm_v1:stores.contacts,hb_settings_v1:stores.settings};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=`homebase-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importJSON=(file)=>{ if(!file)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!confirm("Import will OVERWRITE current data with the contents of this file. Continue?"))return;
      if(d.hb_hist_v1)stores.saveHist(d.hb_hist_v1); if(d.hb_esc_v2)stores.saveEscrow(d.hb_esc_v2);
      if(d.hb_cma_v4)stores.saveCmas(d.hb_cma_v4); if(d.hb_adj_v1)stores.saveAdjLib(d.hb_adj_v1);
      if(d.hb_adjcats_v1)stores.saveAdjCats(d.hb_adjcats_v1); if(d.hb_profile_v1)stores.saveProfile(d.hb_profile_v1);
      if(d.hb_crm_v1)stores.saveContacts(d.hb_crm_v1); if(d.hb_settings_v1)stores.saveSettings(d.hb_settings_v1);
      alert("Import complete.");
    }catch(e){ alert("Import failed: "+e.message); } };
    r.readAsText(file);
  };

  return <div>
    <div style={{display:"flex",gap:2,marginBottom:18,flexWrap:"wrap",borderBottom:"1px solid var(--line)"}}>
      {[["profile","Profile"],["branding","Branding"],["templates","Templates"],["appearance","Appearance"],["lists","Lists & Statuses"],["data","Data"]].map(([k,l])=>

    </div>

    {tab==="profile"&&<>
    {/* Commission plan */}
    <Section title="Commission Plan">
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:12}}>Drives the auto-applied In House / Out of House split and the cap tracker. Rates are percentages.</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12}}>
        <Field label="File Audit Fee ($)">{numIn(comm.auditFee,v=>setComm("auditFee",+v||0))}</Field>
        <Field label="In-House Threshold ($)">{numIn(comm.inHouseThreshold,v=>setComm("inHouseThreshold",+v||0))}</Field>
        <Field label="In-House Fee — at/below ($)">{numIn(comm.inHouseLow,v=>setComm("inHouseLow",+v||0))}</Field>
        <Field label="In-House Fee — above ($)">{numIn(comm.inHouseHigh,v=>setComm("inHouseHigh",+v||0))}</Field>
        <Field label="Pre-cap split (%)">{numIn(Math.round(comm.preCapRate*100),v=>setComm("preCapRate",(+v||0)/100))}</Field>
        <Field label="Post-cap split (%)">{numIn(Math.round(comm.postCapRate*100),v=>setComm("postCapRate",(+v||0)/100))}</Field>
        <Field label="Annual Cap ($)">{numIn(comm.cap,v=>setComm("cap",+v||0))}</Field>
      </div>
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:10}}>Current: {fmt(comm.auditFee)} audit + in-house {fmt(comm.inHouseLow)}/{fmt(comm.inHouseHigh)} at {fmtS(comm.inHouseThreshold)}; brokerage {Math.round(comm.preCapRate*100)}% to {fmt(comm.cap)} cap, then {Math.round(comm.postCapRate*100)}%.</div>
    </Section>

    {/* Profile */}

        <Field label="License #">{txtIn(profile.license,v=>setP("license",v),"License #")}</Field>
        <Field label="Phone">{txtIn(profile.phone,v=>setP("phone",v),"Phone")}</Field>
        <Field label="Email">{txtIn(profile.email,v=>setP("email",v),"Email")}</Field>

    {tab==="branding"&&<>

          </select>
        </Field>
        <Field label="Upcoming-deadline window (days)">{numIn((s.dashboard&&s.dashboard.deadlineDays)??14,v=>saveSettings({...s,dashboard:{...(s.dashboard||{}),deadlineDays:+v||0}}))}</Field>
        <Field label="Follow-up window (days)">{numIn((s.dashboard&&s.dashboard.followupDays)??10,v=>saveSettings({...s,dashboard:{...(s.dashboard||{}),followupDays:+v||0}}))}</Field>
      </div>
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:10}}>The dashboard greeting uses your first name from the Profile section above. Default landing tab applies the next time the app loads.</div>

    {/* Appearance */}
    <Section title="Appearance">
      <div style={{display:"flex",flexWrap:"wrap",gap:24}}>

          <div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:6}}>Accent color</div>

    </>}

// ──────────── Email template editor ────────────
function TemplateEditor({initial, onSave, onCancel}) {
  const [name,setName]=useState(initial?initial.name:"");
  const [subject,setSubject]=useState(initial?initial.subject:"");
  const [body,setBody]=useState(initial?initial.body:"");
  const subRef=useRef(null), bodyRef=useRef(null), activeRef=useRef("body");
  const lblS={fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:700,marginBottom:3};
  const inpStyle={width:"100%",boxSizing:"border-box",padding:"7px 9px",fontSize:13,borderRadius:6,border:"1px solid var(--line-2)",fontFamily:SANS};
  const insert=(token)=>{
    const which=activeRef.current; const el=which==="subject"?subRef.current:bodyRef.current;
    const cur=which==="subject"?subject:body; const setCur=which==="subject"?setSubject:setBody;
    const tok=`{{${token}}}`;
    if(!el||el.selectionStart==null){ setCur((cur||"")+tok); return; }
    const a=el.selectionStart, b=el.selectionEnd;
    setCur(cur.slice(0,a)+tok+cur.slice(b));
    setTimeout(()=>{ try{ el.focus(); const p=a+tok.length; el.setSelectionRange(p,p); }catch(e){} },0);
  };
  return <div style={{border:"1px solid var(--line-2)",borderRadius:8,padding:14,background:"#fff"}}>
    <div style={{display:"grid",gap:10}}>
      <div><div style={lblS}>Template name</div><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Buyer Welcome" style={inpStyle}/></div>
      <div><div style={lblS}>Subject</div><input ref={subRef} onFocus={()=>{activeRef.current="subject";}} value={subject} onChange={e=>setSubject(e.target.value)} placeholder="Subject line (merge fields allowed)" style={inpStyle}/></div>
      <div>
        <div style={lblS}>Merge fields — click to insert at cursor</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {MERGE_FIELDS.map(([grp,items])=><div key={grp} style={{display:"flex",flexWrap:"wrap",gap:4,alignItems:"center"}}>
            <span style={{fontSize:9,color:"var(--ink-3)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.05em"}}>{grp}</span>
            {items.map(([tok,label])=><button key={tok} onClick={()=>insert(tok)} title={`{{${tok}}}`} style={{fontSize:10.5,padding:"3px 8px",borderRadius:4,border:"1px solid var(--line-2)",background:"var(--surface-3)",color:"var(--accent)",cursor:"pointer",fontFamily:SANS}}>{label}</button>)}
          </div>)}
        </div>
      </div>
      <div><div style={lblS}>Body</div><textarea ref={bodyRef} onFocus={()=>{activeRef.current="body";}} value={body} onChange={e=>setBody(e.target.value)} rows={14} placeholder="Type your email. Click a merge-field chip above to insert {{Tokens}} at your cursor." style={{...inpStyle,resize:"vertical",lineHeight:1.5}}/></div>
    </div>
    <div style={{display:"flex",gap:8,marginTop:12}}>
      <button onClick={()=>onSave({id:initial?initial.id:("tpl_"+uid()),name:(name.trim()||"Untitled"),subject,body})} style={btnPrimary}>Save template</button>
      <button onClick={onCancel} style={btnGhost}>Cancel</button>
    </div>
  </div>;
}

// ──────────── CRM contact picker (search + type filter) ────────────

      <div style={{padding:"12px 16px"}}>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name, email, phone, address…" style={{width:"100%",boxSizing:"border-box",padding:"8px 10px",fontSize:13,borderRadius:8,border:"1px solid var(--line-2)",fontFamily:SANS,marginBottom:10}}/>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>{types.map(t=><button key={t} onClick={()=>setType(t)} style={chip(type===t)}>{t}</button>)}</div>
        <div style={{maxHeight:340,overflow:"auto",display:"flex",flexDirection:"column",gap:6}}>
          {list.length===0
            ? <div style={{fontSize:12,color:"var(--ink-3)",fontFamily:SANS,padding:"8px 2px"}}>No matching contacts.</div>
            : list.map(c=><button key={c.id} onClick={()=>onPick(c)} style={{textAlign:"left",border:"1px solid var(--line)",borderRadius:8,padding:"9px 11px",background:"#fff",cursor:"pointer",fontFamily:SANS}}>
                <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style={{fontWeight:600,fontSize:13,color:"var(--ink)"}}>{c.name||"(no name)"}</span>
                  {c.type&&<span style={{fontSize:10,color:"var(--ink-2)"}}>{c.type}</span>}
                </div>
                <div style={{fontSize:11,color:"var(--ink-2)",marginTop:2}}>{[c.email,c.phone].filter(Boolean).join("  ·  ")||"—"}</div>
              </button>)}
        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Homebase));

</script>
</body>
</html>
