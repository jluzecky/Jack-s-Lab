     reflow are driven by these classes instead. align-items:start

  .hb-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;}

  .hb-sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}

  @media (max-width:900px){

    .hb-grid-3{grid-template-columns:repeat(2,1fr);}
    .hb-grid-2{grid-template-columns:1fr;}
  }
  @media (max-width:560px){
    :root{--shell-pad-x:13px;--shell-pad-y:16px;}
    /* Two up rather than one: the tiles are short, and stacking all four

    .hb-grid-4,.hb-grid-3{grid-template-columns:repeat(2,1fr);}

  /* ── Data tables ───────────────────────────────────────────────
     A sticky header only works inside an element that actually scrolls
     vertically. overflow-x:auto alone computes overflow-y to auto, which
     makes a scroll container with no vertical scroll — the header then
     pins to a box that scrolls away with the page. Capping the height on
     wide screens gives the header something real to stick to; on small
     screens the page scroll is the better interaction, so no cap. */

  .hb-rows tbody tr:nth-child(even){background:var(--row-even);}
  .hb-rows tbody tr:hover{background:var(--row-hover);}
  .hb-rows tbody tr{transition:background .1s ease;}
  /* Pinned first column: opaque so rows scroll under it, and painted with the

  .hb-rows tbody td.hb-stick{background:var(--surface);}
  .hb-rows tbody tr:nth-child(even) td.hb-stick{background:var(--row-even);}
  .hb-rows tbody tr:hover td.hb-stick{background:var(--row-hover);}

// Read an image file, downscale it, and return a data URL. Keeps PNG (transparency) for logos/signatures.
function readImageScaled(file, maxW=900, quality=0.82){
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error("No file selected."));
    if(!/^image\//.test(file.type)) return rej(new Error("That file isn't an image."));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("Could not read that file."));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("Could not decode that image."));
      img.onload=()=>{
        try{
          const s=Math.min(1,maxW/(img.width||maxW));
          const w=Math.max(1,Math.round((img.width||maxW)*s)), h=Math.max(1,Math.round((img.height||maxW)*s));
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          const ctx=c.getContext("2d");
          const png=/png|svg/i.test(file.type);
          if(!png){ ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); }
          ctx.drawImage(img,0,0,w,h);
          res(png?c.toDataURL("image/png"):c.toDataURL("image/jpeg",quality));
        }catch(e){ rej(new Error("Could not process that image.")); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const COMM = { auditFee:250, inHouseThreshold:250000, inHouseLow:250, inHouseHigh:500, preCapRate:0.30, postCapRate:0.12, cap:15000 };
const COMM_TYPES = ["In House","Out of House"];
// pure: given gross, type, sale price, brokerage-30% already collected this year (capUsed), plan config,
// and an optional manual brokerage amount for this deal (overrides the 30/12 split and drives the cap)
function calcCommission(gross, type, price, capUsed, comm, brokerageOverride){
  comm = comm||COMM;
  gross = +gross||0; capUsed = +capUsed||0;
  const audit = +comm.auditFee||0;
  const inhouse = type==="In House" ? ((+price||0)<=comm.inHouseThreshold?(+comm.inHouseLow||0):(+comm.inHouseHigh||0)) : 0;
  const base = Math.max(0, gross - audit - inhouse);
  const capRoom = Math.max(0, (+comm.cap||0) - capUsed);
  const ov = (brokerageOverride!=null && brokerageOverride!=="") ? Math.max(0,+brokerageOverride||0) : null;
  let preTake, postTake;
  if(ov!=null){
    preTake = Math.min(ov, capRoom);                      // manual brokerage counts toward cap up to remaining room
    postTake = Math.max(0, ov - preTake);                 // anything beyond the cap doesn't count
  } else {
    const full30 = base*(+comm.preCapRate||0);
    preTake = Math.min(full30, capRoom);                  // pre-cap %, counts toward cap
    const baseAt30 = comm.preCapRate>0 ? preTake/comm.preCapRate : 0;
    const postBase = Math.max(0, base - baseAt30);
    postTake = postBase*(+comm.postCapRate||0);           // post-cap %, does NOT count toward cap
  }
  const brokerage = preTake + postTake;
  const agentNet = base - brokerage;
  return { gross, audit, inhouse, base, preTake, postTake, brokerage, agentNet, capContribution:preTake, brokOverridden: ov!=null };
}

  useEffect(() => { let alive=true; (async()=>{
    try {
      const { data: row, error } = await supa.from("homebase_store").select("value").eq("key", key).maybeSingle();
      if (!alive) return;
      if (error) { console.error("load "+key, error.message); return; }
      if (row && row.value != null) setData(row.value);
      else { supa.from("homebase_store").upsert({ key, value: seed }).then(({error})=>{ if(error) console.error("seed "+key, error.message); }); }
    } catch(e){ console.error("load "+key, e); }
  })(); return ()=>{ alive=false; }; }, []);
  const save = (val) => { setData(val); supa.from("homebase_store").upsert({ key, value: val }).then(({error})=>{ if(error) console.error("save "+key, error.message); }); };
  return [data, save];
};

// ════════════════════════ CHART PRIMITIVES ════════════════════════
function Bar({data,color="var(--accent)",h=110}) {
  const max=Math.max(...data.map(d=>d.v),1);
  // Widen the bars when there are few of them, so a 2-point chart doesn't
  // sit as a narrow sliver in a wide panel. Slot = bar + 8px gutter.
  const n=data.length;
  const SLOT = n<=2 ? 132 : n<=4 ? 104 : n<=6 ? 78 : 54;
  const BW = SLOT-8;
  const W = n*SLOT;
  // An explicit height is required: with only a viewBox and width:100% the
  // SVG preserves aspect ratio and scales to the container, so a 2-bar chart
  // rendered ~6x oversized. Height pins the vertical scale; "meet" centres
  // narrow charts instead of stretching them.
  return <svg viewBox={`0 0 ${W} ${h+32}`} height={h+32} preserveAspectRatio="xMidYMid meet" style={{width:"100%",maxWidth:W,display:"block",margin:"0 auto",overflow:"visible"}}>
    {data.map((d,i)=>{const bh=Math.max(2,(d.v/max)*(h-18));const x=i*SLOT+4;const y=h-bh;const cx=x+BW/2;
      return <g key={i}><rect x={x} y={y} width={BW} height={bh} rx={3} fill={color} opacity={0.86}/><text x={cx} y={h+14} textAnchor="middle" fontSize={10} fill="var(--ink-2)">{d.l}</text><text x={cx} y={y-5} textAnchor="middle" fontSize={9.5} fontWeight="600" fill="var(--ink-2)">{d.f||fmtS(d.v)}</text></g>;})}
  </svg>;
}
function Line({series,h=140}) {
  const all=series.flatMap(s=>s.data.map(d=>d.v));const max=Math.max(...all,1);const labels=series[0]?.data.map(d=>d.l)||[];
  const W=Math.max(labels.length*56,200);const pad={t:20,b:26,l:8,r:8};
  const xs=(i)=>pad.l+i*(W/(Math.max(labels.length-1,1)));const ys=(v)=>pad.t+(1-v/max)*(h-pad.t-pad.b);
  return <svg viewBox={`0 0 ${W+16} ${h}`} height={h} preserveAspectRatio="xMidYMid meet" style={{width:"100%",display:"block",overflow:"visible"}}>
    {[0,0.5,1].map(f=><line key={f} x1={pad.l} x2={W+pad.r} y1={ys(f*max)} y2={ys(f*max)} stroke="var(--line)" strokeWidth={0.5}/>)}
    {series.map((s,si)=>{const pts=s.data.map((d,i)=>`${xs(i)},${ys(d.v)}`).join(" ");const fp=[`${xs(0)},${ys(0)}`,...s.data.map((d,i)=>`${xs(i)},${ys(d.v)}`),`${xs(s.data.length-1)},${ys(0)}`].join(" ");
      return <g key={si}><polygon points={fp} fill={CC[si]} opacity={0.07}/><polyline points={pts} fill="none" stroke={CC[si]} strokeWidth={2} strokeLinejoin="round"/>{s.data.map((d,i)=><circle key={i} cx={xs(i)} cy={ys(d.v)} r={3} fill={CC[si]}/>)}</g>;})}
    {labels.map((l,i)=><text key={i} x={xs(i)} y={h-4} textAnchor="middle" fontSize={10} fill="var(--ink-2)">{l}</text>)}
  </svg>;
}
function Donut({segs,size=120}) {
  const total=segs.reduce((s,x)=>s+x.v,0)||1;let off=0;const r=38;const cx=size/2;const cy=size/2;
  const arc=(start,end)=>{const a1=start*2*Math.PI-Math.PI/2;const a2=end*2*Math.PI-Math.PI/2;const x1=cx+r*Math.cos(a1);const y1=cy+r*Math.sin(a1);const x2=cx+r*Math.cos(a2);const y2=cy+r*Math.sin(a2);return `M${cx} ${cy}L${x1} ${y1}A${r} ${r} 0 ${(end-start)>0.5?1:0} 1 ${x2} ${y2}Z`;};
  return <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>{segs.map((s,i)=>{const start=off;off+=s.v/total;return <path key={i} d={arc(start,off)} fill={CC[i%CC.length]} opacity={0.85}/>;})}<circle cx={cx} cy={cy} r={22} fill="var(--surface)"/></svg>;
}

// ════════════════════════ TITLE EMAIL ENGINE ════════════════════════
// Turns one pipeline transaction into { subject, to, cc, body }. Reads the
// existing escrow field names plus the email-only fields added to ESCROW_DETAILS.
const tmMD = (iso) => { if(!iso) return ""; const p=String(iso).split("-"); return p.length===3?`${p[1]}/${p[2]}`:iso; };
const tmMoney = (v) => { if(v==null||v==="") return ""; const n=Number(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?String(v):"$"+n.toLocaleString("en-US"); };
const tmJoin = (arr,sep=" | ") => arr.filter(Boolean).join(sep);
const tmFirst = (full="") => full.replace(/\(.*?\)/g,"").trim().split(/\s+/)[0]||"";
const tmNames = (arr) => { const a=arr.filter(Boolean); if(a.length<=1) return a[0]||""; if(a.length===2) return `${a[0]} and ${a[1]}`; return a.slice(0,-1).join(", ")+" and "+a.slice(-1); };

function buildTitleEmail(tx, cfg={}) {
  const sell = tx.side==="sell";
  const myLabel = tx.myBrokerage || cfg.myBrokerage || "1 Degree";
  const clients = (sell
    ? [{name:tx.sellerName,email:tx.sellerEmail,phone:tx.sellerPhone},{name:tx.sellerName2,email:tx.sellerEmail2,phone:tx.sellerPhone2}]
    : [{name:tx.buyerName,email:tx.buyerEmail,phone:tx.buyerPhone},{name:tx.buyerName2,email:tx.buyerEmail2,phone:tx.buyerPhone2}]
  ).filter(c=>c.name);
  const clientFor = tx.clientEntity || tmNames(clients.map(c=>c.name));
  const team = (tx.titleTeam||[]).filter(t=>t.name);
  const attach = (tx.attachments||[]).filter(Boolean);
  const L = [];
  L.push(`Hey ${tmNames(team.map(t=>t.name))},`);
  L.push("");
  L.push(`Attached is the ${sell?"SALE":"PURCHASE"} agreement for ${clientFor||"[client]"}, for the property at ${tx.address}.`);
  L.push("");
  if(attach.length){ L.push("Attachments:"); attach.forEach(a=>L.push(`  \u2022 ${a}`)); L.push(""); }
  L.push(`${sell?"Seller":"Buyer"} (Client):${tx.clientEntity?" "+tx.clientEntity:""}`);
  clients.forEach(c=>L.push("  "+tmJoin([c.name,c.email,c.phone])));
  L.push("");
  const oaName = sell?tx.buyerAgent:tx.listAgent;
  if(oaName){ L.push(`${sell?"Buyer Agent":"Listing Agent"}:`); L.push("  "+tmJoin([oaName, sell?tx.buyerBrokerage:tx.listBrokerage])); const oaE=sell?tx.buyerAgentEmail:tx.listAgentEmail; if(oaE) L.push("  "+oaE); L.push(""); }
  if(tx.lenderInstitution||tx.lender){ L.push("Buyer's Lender:"); L.push("  "+tmJoin([tx.lenderInstitution||tx.lender, tx.lenderContact||(tx.lenderInstitution?tx.lender:"")])); if(tx.lenderEmail) L.push("  "+tx.lenderEmail); L.push(""); }
  const otName = sell?tx.buyerTitleCo:tx.sellerTitleCo;
  if(otName){ L.push(`${sell?"Buyer's":"Seller's"} Title Company:`); L.push("  "+otName); (tx.titleContacts||[]).forEach(c=>c.name&&L.push("  "+tmJoin([c.name,c.email]))); L.push(""); }
  L.push("Agent Commissions:");
  const myComm = sell?tx.listAgentComm:tx.buyerAgentComm;
  L.push(`  \u2022 ${myLabel} \u2013 ${myComm||"Unknown"}`);
  if(tx.myCommPayer) L.push(`      ${tx.myCommPayer}`);
  if(tx.otherCommLabel) L.push(`  \u2022 ${tx.otherCommLabel} \u2013 ${tx.otherComm||"Unknown"}`);
  L.push("");
  L.push("Transaction Details:");
  L.push(`  \u2022 Purchase Price: ${tmMoney(tx.price)}`);
  if(tx.earnestAmount) L.push(`  \u2022 Earnest Money: ${tmMoney(tx.earnestAmount)}`);
  if(tx.buildingType) L.push(`  \u2022 Building Type: ${tx.buildingType}`);
  if(tx.occupancy) L.push(`  \u2022 Occupancy: ${tx.occupancy}`);
  if(tx.workPerformed) L.push(`  \u2022 Work Performed: ${tx.workPerformed}`);
  L.push("");
  const cand = [
    {d:tx.acceptance,t:"Acceptance Deadline",o:1},
    {d:tx.earnest,t:"Earnest Money",o:2},
    {d:tx.inspection,t:`Inspection Deadline${tx.inspectionNote?` (${tx.inspectionNote})`:""}`,o:3},
    {d:tx.insurability,t:"Buyer Insurability",o:4},
    {d:tx.muniInspection,t:"Seller to Complete STL City Occupancy Inspections",o:5},
    {d:tx.titleSurvey,t:"Title Search & Survey",o:7},
    {d:tx.closing,t:"Closing",o:9},
  ];
  if(tx.financing&&tx.appraisal&&tx.financing===tx.appraisal){ cand.push({d:tx.financing,t:"Financing & Appraisal Deadline",o:6}); }
  else { if(tx.financing) cand.push({d:tx.financing,t:"Financing",o:6}); if(tx.appraisal) cand.push({d:tx.appraisal,t:"Appraisal",o:6.5}); }
  const rows = cand.filter(c=>c.d).sort((a,b)=>a.d===b.d?a.o-b.o:(a.d<b.d?-1:1));
  if(rows.length){ L.push("Timeline & Contingencies:"); rows.forEach(r=>L.push(`  \u2022 ${tmMD(r.d)} \u2013 ${r.t}`)); L.push(""); }
  const cc = clients.map(c=>c.email).filter(Boolean);
  L.push(`Let me know if you need anything else.${clients.length?` I've copied our client${clients.length>1?"s":""}, ${tmNames(clients.map(c=>tmFirst(c.name)))}, on this email, too.`:""}`);
  L.push(""); L.push("Thanks,");
  if(tx._signature) L.push(tx._signature);
  return { subject:`Title Order \u2013 ${tx.address}${clientFor?` \u2013 ${clientFor}`:""}`, to:team.map(t=>t.email).filter(Boolean), cc, body:L.join("\n") };
}

// ── Email merge engine ──
function mergeTokens(tpl, vals){ return (tpl||"").replace(/\{\{(\w+)\}\}/g,(m,k)=> (vals[k]!=null&&vals[k]!=="") ? vals[k] : m); }
function fullDate(iso){ const dt=isoToDate(iso); return dt?`${MONTHS[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`:""; }
// All merge fields available to templates, grouped for the palette
const MERGE_FIELDS = [
  ["Property", [["PropertyAddress","Property Address"],["SalePrice","Sale Price"],["EarnestAmount","Earnest Amount"],["ClosingDate","Closing Date"]]],
  ["People", [["SellerNames","Seller Name(s)"],["BuyerNames","Buyer Name(s)"],["ListingAgent","Listing Agent"],["BuyersAgent","Buyer's Agent"],["Lender","Lender"]]],
  ["Companies", [["TitleCompany","Title Company"],["ListingBrokerage","Listing Brokerage"],["BuyersBrokerage","Buyer's Brokerage"]]],
  ["Dates", [["ContractDate","Contract Date"],["AcceptanceDate","Acceptance"],["EarnestDate","Earnest Date"],["InspectionDate","Inspection"],["InsurabilityDate","Insurability"],["MuniInspectionDate","Muni Inspection"],["InspResolutionDate","Insp. Resolution"],["TitleSurveyDate","Title & Survey"],["FinancingDate","Financing"],["AppraisalDate","Appraisal"]]],
  ["You", [["AgentName","Your Name"],["AgentEmail","Your Email"],["AgentPhone","Your Phone"]]],
];
// Resolve every merge field from a transaction + profile (missing -> [bracket] placeholder)
function mergeValues(tx, profile){
  const v={}; const put=(k,val,label)=>{ v[k]=(val!=null&&val!=="")?val:`[${label}]`; };
  put("PropertyAddress", tx.address, "property address");
  put("SalePrice", tx.price?tmMoney(tx.price):"", "sale price");
  put("EarnestAmount", tx.earnestAmount?tmMoney(tx.earnestAmount):"", "earnest amount");
  put("ClosingDate", fullDate(tx.closing), "closing date");
  put("SellerNames", tmNames([tx.sellerName,tx.sellerName2].filter(Boolean))||tx.clientEntity, "seller name(s)");
  put("BuyerNames", tmNames([tx.buyerName,tx.buyerName2].filter(Boolean)), "buyer name(s)");
  put("ListingAgent", tx.listAgent, "listing agent");
  put("BuyersAgent", tx.buyerAgent, "buyer's agent");
  put("Lender", tx.lenderInstitution||tx.lender, "lender");
  put("TitleCompany", tx.sellerTitleCo||tx.buyerTitleCo, "title company");
  put("ListingBrokerage", tx.listBrokerage, "listing brokerage");
  put("BuyersBrokerage", tx.buyerBrokerage, "buyer's brokerage");
  put("AgentName", profile&&profile.agentName, "your name");
  put("AgentEmail", profile&&profile.email, "your email");
  put("AgentPhone", profile&&profile.phone, "your phone");
  put("ContractDate", fullDate(tx.contractDate), "contract date");
  put("AcceptanceDate", fullDate(tx.acceptance), "acceptance date");
  put("EarnestDate", fullDate(tx.earnest), "earnest date");
  put("InspectionDate", fullDate(tx.inspection), "inspection date");
  put("InsurabilityDate", fullDate(tx.insurability), "insurability date");
  put("MuniInspectionDate", fullDate(tx.muniInspection), "muni inspection date");
  put("InspResolutionDate", fullDate(tx.inspResolution), "insp. resolution date");
  put("TitleSurveyDate", fullDate(tx.titleSurvey), "title & survey date");
  put("FinancingDate", fullDate(tx.financing), "financing date");
  put("AppraisalDate", fullDate(tx.appraisal), "appraisal date");
  return v;
}
function tokensUsed(str){ return [...new Set((String(str||"").match(/\{\{(\w+)\}\}/g)||[]).map(m=>m.replace(/[{}]/g,"")))]; }

function Homebase() {
  const [parent, setParent] = useState("home");

  // stores
  const [hist, saveHist] = useStore("hb_hist_v1", SEED_HISTORY);
  const [escrow, saveEscrow] = useStore("hb_esc_v2", SEED_ESCROW);
  const [cmas, saveCmas] = useStore("hb_cma_v4", SEED_CMAS);
  const [adjLib, saveAdjLib] = useStore("hb_adj_v1", SEED_ADJ);
  const [adjCats, saveAdjCats] = useStore("hb_adjcats_v1", SEED_ADJ_CATS);
  const [profile, saveProfile] = useStore("hb_profile_v1", SEED_PROFILE);
  const [contacts, saveContacts] = useStore("hb_crm_v1", SEED_CONTACTS);
  const [settings, saveSettings] = useStore("hb_settings_v1", SEED_SETTINGS);
  const landedRef=useRef(false);
  useEffect(()=>{ if(!landedRef.current && settings && settings.defaultTab){ landedRef.current=true; if(settings.defaultTab!=="home") setParent(settings.defaultTab); } },[settings]);

  const addrOptions = useMemo(()=>["",...Array.from(new Set([...hist.map(h=>h.address),...escrow.map(e=>e.address)]))],[hist,escrow]);

  // Lifecycle promotion: CMA → Pipeline (creates an active deal, carries address/zip/client/target price)
  const promoteCmaToPipeline=(cma)=>{
    if(cma.promotedTo && escrow.some(r=>r.id===cma.promotedTo)){ if(!confirm("This CMA is already linked to a pipeline deal. Create another?")) return; }
    const sts=names(settings.pipelineStatuses); const status=sts.includes("On Market")?"On Market":(sts[0]||"On Market");
    const newId=uid();
    const newRow={ id:newId, address:cma.subject||"", zip:cma.zip||"", price:+cma.listPrice||0, agentComm:0, gross:0, status, side:"sell",
      sellerName:cma.client||"", photosLink:cma.photosLink||"", compsLink:cma.compsLink||"",
      notes:`Promoted from CMA${cma.listPrice?` (target ${fmt(+cma.listPrice)})`:""}` };
    saveEscrow([...escrow,newRow]);
    saveCmas(cmas.map(c=>c.id===cma.id?{...c,promotedTo:newId}:c));
    setParent("sales");
  };

  // Mirror the accent onto :root so portaled overlays (report frames) can resolve it too.
  useEffect(()=>{
    const acc=(settings&&settings.accent)||"#2f4034";
    document.documentElement.style.setProperty("--accent",acc);
    document.documentElement.style.setProperty("--accent-2",(settings&&settings.accent2)||"#b5a36f");
    return ()=>{};
  },[settings&&settings.accent,settings&&settings.accent2]);

  const parentS=(k)=>({padding:"9px 16px 11px",fontSize:13.5,fontWeight:parent===k?700:500,letterSpacing:"0.02em",color:parent===k?"var(--ink)":"var(--ink-3)",background:"none",border:"none",borderBottom:parent===k?"2.5px solid var(--accent-2)":"2.5px solid transparent",marginBottom:-1,cursor:"pointer",fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",whiteSpace:"nowrap",transition:"color .12s ease"});

  return (
    <SettingsCtx.Provider value={settings}>
    <div style={{
        // Palette tokens live on :root; only the user-configurable values and
        // density need to be re-declared per-subtree. The --color-* aliases
        // this used to carry are gone — nothing references them any more.
        "--accent": (settings&&settings.accent)||"#2f4034",
        "--accent-2": (settings&&settings.accent2)||"#b5a36f",
        "--rowpad-y": (settings&&settings.density==="compact")?"3px":"7px",
        "--rowpad-x": (settings&&settings.density==="compact")?"6px":"9px",
        fontFamily:"'Georgia',serif",
        color:"var(--ink)",
        background:"var(--paper)",
        border:"1px solid var(--line)",
        borderRadius:8,
        maxWidth:1080, margin:"0 auto", padding:"var(--shell-pad-y) var(--shell-pad-x) 48px"
      }}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18,paddingBottom:16,borderBottom:"1.5px solid var(--line-3)"}}>
        {brandList(profile)[0]&&brandList(profile)[0].logo
          ? <img src={brandList(profile)[0].logo} alt="" style={{height:34,maxWidth:150,objectFit:"contain",flexShrink:0}}/>
          : <div style={{width:34,height:34,borderRadius:8,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        </div>}
        <div style={{flex:1}}>
          <h2 style={{fontSize:24,fontWeight:700,color:"var(--ink)",margin:0,letterSpacing:"-0.4px"}}>Homebase</h2>
          <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",marginTop:1,textTransform:"uppercase",letterSpacing:"0.12em"}}>Every transaction, one place · Luzecky Real Estate</div>
        </div>
      </div>

      <div className="hb-tabs" style={{marginBottom:24,borderBottom:"1px solid var(--line)"}}>
        {[["home","Home"],["sales","My Sales"],["cmas","My CMAs"],["crm","My CRM"],["settings","Settings"]].map(([k,l])=><button key={k} onClick={()=>setParent(k)} style={parentS(k)}>{l}</button>)}
      </div>

      {parent==="home" && <Dashboard hist={hist} escrow={escrow} cmas={cmas} contacts={contacts} go={setParent} profile={profile} adjLib={adjLib}/>}
      {parent==="sales" && <MySales hist={hist} saveHist={saveHist} escrow={escrow} saveEscrow={saveEscrow} profile={profile} saveProfile={saveProfile} contacts={contacts}/>}
      {parent==="cmas" && <MyCMAs cmas={cmas} saveCmas={saveCmas} adjLib={adjLib} saveAdjLib={saveAdjLib} adjCats={adjCats} saveAdjCats={saveAdjCats} profile={profile} saveProfile={saveProfile} addrOptions={addrOptions} onPromote={promoteCmaToPipeline}/>}
      {parent==="crm" && <MyCRM contacts={contacts} saveContacts={saveContacts} addrOptions={addrOptions}/>}
      {parent==="settings" && <Settings settings={settings} saveSettings={saveSettings} profile={profile} saveProfile={saveProfile} stores={{hist,saveHist,escrow,saveEscrow,cmas,saveCmas,adjLib,saveAdjLib,adjCats,saveAdjCats,profile,saveProfile,contacts,saveContacts,settings,saveSettings}}/>}
    </div>
    </SettingsCtx.Provider>
  );
}

const thS={textAlign:"left",padding:"var(--rowpad-y,7px) var(--rowpad-x,9px)",fontSize:10,color:"var(--ink-2)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap",fontFamily:SANS,borderBottom:"1px solid var(--line-2)",background:"var(--surface-3)",position:"sticky",top:0,zIndex:1};
const tdS=(e={})=>({padding:"var(--rowpad-y,7px) var(--rowpad-x,9px)",fontFamily:SANS,fontSize:12.5,borderBottom:"1px solid var(--line)",fontVariantNumeric:"tabular-nums",...e});
const Card=({l,v,accent})=>(<div style={{background:"var(--surface)",border:"1px solid var(--line)",borderTop:`3px solid ${accent||"var(--accent)"}`,borderRadius:"var(--r)",overflow:"hidden",boxShadow:"var(--sh-1)",padding:"12px 14px"}}><div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.07em",fontWeight:600,marginBottom:4}}>{l}</div><div style={{fontSize:21,fontWeight:700,color:accent||"var(--ink)",fontFamily:SERIF,fontVariantNumeric:"tabular-nums"}}>{v}</div></div>);
const Section=({title,children})=>(<div style={{background:"var(--surface-2)",border:"1px solid var(--line)",borderRadius:"var(--r)",overflow:"hidden",boxShadow:"var(--sh-1)",marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:"var(--ink)",fontFamily:SERIF,fontVariant:"small-caps",letterSpacing:"0.03em",padding:"9px 14px",borderBottom:"1px solid var(--rule)"}}>{title}</div><div style={{padding:14}}>{children}</div></div>);
const btnPrimary={fontSize:12,padding:"8px 16px",borderRadius:"var(--r-sm)",border:"1px solid var(--accent)",background:"var(--accent)",color:"#fff",cursor:"pointer",fontFamily:SANS,fontWeight:600,letterSpacing:"0.01em",boxShadow:"var(--sh-1)"};
const btnGhost={fontSize:12,padding:"7px 13px",borderRadius:"var(--r-sm)",border:"1px solid var(--line-2)",background:"var(--surface)",color:"var(--ink-2)",cursor:"pointer",fontFamily:SANS,fontWeight:500};
const typeColor=(t)=>t==="B"?{bg:"#dbeafe",text:"#1e40af"}:t==="S"?{bg:"#dcfce7",text:"#166534"}:{bg:"#f3f4f6",text:"#374151"};

// ════════════════════════ HOME DASHBOARD ════════════════════════
function Dashboard({hist,escrow,cmas,contacts,go,profile,adjLib}) {
  const S=useSettings();
  const statusColors=colorMap(S.pipelineStatuses); const cmaColors=colorMap(S.cmaStatuses);
  const dlDays=(S.dashboard&&S.dashboard.deadlineDays)||14;
  const fuDays=(S.dashboard&&S.dashboard.followupDays)||10;
  const today=new Date(); today.setHours(0,0,0,0);
  const yr=today.getFullYear();
  const days=(a,b)=>Math.round((a-b)/86400000);

  // YTD production (current vs prior year, same date cutoff)
  const prodYTD=(year)=>{const cut=new Date(year,today.getMonth(),today.getDate(),23,59,59);let vol=0,agent=0,n=0;hist.forEach(r=>{const d=parseDate(r.date);if(d.getFullYear()===year&&d<=cut){vol+=r.price||0;agent+=r.agent||0;n++;}});return {vol,agent,n};};
  const cur=prodYTD(yr), prev=prodYTD(yr-1);
  const pct = prev.agent>0 ? Math.round((cur.agent-prev.agent)/prev.agent*100) : null;

  const pipeVol=escrow.reduce((s,r)=>s+(r.price||0),0);
  const pipeAgent=escrow.reduce((s,r)=>s+(r.agentComm||0),0);
  const activeClients=contacts.filter(c=>["Active","Under Contract"].includes(c.stage)).length;

  // deadlines
  const deadlines=useMemo(()=>{const out=[];escrow.forEach(r=>CONTINGENCIES.forEach(c=>{const dt=isoToDate(r[c.key]);if(dt&&!(r.done&&r.done[c.key]))out.push({dt,addr:r.address,key:c.key,short:c.short,label:c.label,status:r.status});}));return out;},[escrow]);
  const upcoming=deadlines.filter(e=>e.dt>=today&&days(e.dt,today)<=dlDays).sort((a,b)=>a.dt-b.dt);
  const passed=deadlines.filter(e=>e.dt<today&&days(today,e.dt)<=30&&e.status==="Pending").sort((a,b)=>b.dt-a.dt);
  const nextClosing=escrow.map(r=>({r,dt:isoToDate(r.closing)})).filter(x=>x.dt&&x.dt>=today).sort((a,b)=>a.dt-b.dt)[0];

  // follow-ups
  const fu=contacts.filter(c=>c.nextFollowUp).map(c=>({...c,dt:parseDate(c.nextFollowUp)})).filter(c=>c.dt&&c.dt.getFullYear()>2000).sort((a,b)=>a.dt-b.dt);
  const dueSoon=fu.filter(c=>days(c.dt,today)<=fuDays);

  // forecast: projected agent comm by closing month
  const forecast=useMemo(()=>{const m={};escrow.forEach(r=>{const dt=isoToDate(r.closing);if(dt&&(r.agentComm||0)>0){const k=dt.getFullYear()*12+dt.getMonth();m[k]=(m[k]||0)+r.agentComm;}});return Object.entries(m).map(([k,v])=>({k:+k,v})).sort((a,b)=>a.k-b.k).map(o=>({l:`${MONTHS[o.k%12].slice(0,3)} '${String(Math.floor(o.k/12)).slice(2)}`,v:o.v}));},[escrow]);

  // CMAs needing attention
  const cmaAttn=cmas.filter(c=>["Draft","Sent to Client"].includes(c.status||"Draft"));
  const pipeStatuses=names(S.pipelineStatuses);
  const pipeCounts={};escrow.forEach(r=>{pipeCounts[r.status]=(pipeCounts[r.status]||0)+1;});

  const initials=(n)=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const Tile=({l,v,sub,accent,onClick})=>(<div onClick={onClick} className={onClick?"hb-hover":""} style={{background:"var(--surface)",border:"1px solid var(--line)",borderTop:`3px solid ${accent||"var(--accent)"}`,borderRadius:"var(--r)",overflow:"hidden",boxShadow:"var(--sh-1)",padding:"13px 15px",cursor:onClick?"pointer":"default",minWidth:0}}>
    <div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase",letterSpacing:"0.07em",fontWeight:600,marginBottom:4}}>{l}</div>
    <div style={{fontSize:"clamp(18px,4.4vw,22px)",fontWeight:700,color:accent||"var(--ink)",fontFamily:SERIF,fontVariantNumeric:"tabular-nums",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{v}</div>
    {sub&&<div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginTop:3}}>{sub}</div>}
  </div>);
  const SecLink=({title,onClick,children})=>(<div style={{background:"var(--surface-2)",border:"1px solid var(--line)",borderRadius:"var(--r)",overflow:"hidden",boxShadow:"var(--sh-1)",minWidth:0}}>
    <div className="hb-sechead" style={{padding:"10px 14px",borderBottom:"1px solid var(--line)"}}>
      <span style={{fontSize:13,fontWeight:700,color:"var(--ink)",fontFamily:SERIF,fontVariant:"small-caps",letterSpacing:"0.03em"}}>{title}</span>
      {onClick&&<button onClick={onClick} style={{...btnGhost,fontSize:11,padding:"3px 9px"}}>Open →</button>}
    </div>
    <div style={{padding:12}}>{children}</div>
  </div>);

  const greeting=(()=>{const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";})();
  const longDate=`${DOW[today.getDay()]==="Sun"?"Sunday":["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][today.getDay()]}, ${MONTHS[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

  return <div>
    <div style={{marginBottom:18}}>
      <div style={{fontFamily:SERIF,fontSize:19,fontWeight:700,color:"var(--ink)"}}>{greeting}{(profile&&profile.agentName)?`, ${profile.agentName.trim().split(/\s+/)[0]}`:""}.</div>
      <div style={{fontFamily:SANS,fontSize:12,color:"var(--ink-2)"}}>{longDate}</div>
    </div>

    <div className="hb-grid-4" style={{marginBottom:18}}>
      <Tile l="Pipeline Volume" v={fmtS(pipeVol)} sub={`${escrow.length} active · ${fmt(pipeAgent)} agent comm`} onClick={()=>go("sales")}/>
      <Tile l={`YTD Agent Comm (${yr})`} v={fmt(cur.agent)} sub={pct===null?`${cur.n} closings`:`${cur.n} closings · ${pct>=0?"+":""}${pct}% vs ${yr-1} YTD`} accent="#0f7a52" onClick={()=>go("sales")}/>
      <Tile l="Active Clients" v={String(activeClients)} sub={`${contacts.length} contacts total`} accent="#6b21a8" onClick={()=>go("crm")}/>
      <Tile l="CMAs Out" v={String(cmas.filter(c=>c.status==="Sent to Client").length)} sub={`${cmaAttn.length} need attention`} accent="#8a6d1f" onClick={()=>go("cmas")}/>
    </div>

    <div className="hb-grid-2" style={{marginBottom:14}}>
      <SecLink title={`Upcoming deadlines · ${dlDays} days`} onClick={()=>go("sales")}>
        {upcoming.length===0?<div style={{fontSize:12,color:"var(--ink-3)",fontFamily:SANS,padding:"6px 0"}}>Nothing due in the next two weeks.</div>:
          upcoming.slice(0,8).map((e,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:i<Math.min(upcoming.length,8)-1?"1px solid var(--line)":"none"}}>
            <div style={{width:42,textAlign:"center",flexShrink:0}}><div style={{fontFamily:SERIF,fontSize:15,fontWeight:700,color:"var(--ink)"}}>{e.dt.getDate()}</div><div style={{fontSize:9,color:"var(--ink-2)",fontFamily:SANS,textTransform:"uppercase"}}>{MONTHS[e.dt.getMonth()].slice(0,3)}</div></div>
            <div style={{width:3,alignSelf:"stretch",background:CONTINGENCY_COLORS[e.key]}}/>
            <div style={{flex:1,minWidth:0}}><div style={{fontFamily:SANS,fontSize:12.5,fontWeight:600,color:"var(--ink)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.addr}</div><div style={{fontFamily:SANS,fontSize:11,color:CONTINGENCY_COLORS[e.key]}}>{e.label}</div></div>
            <div style={{fontSize:10,color:"var(--ink-2)",fontFamily:SANS,whiteSpace:"nowrap"}}>{days(e.dt,today)===0?"today":`${days(e.dt,today)}d`}</div>
          </div>)}
        {passed.length>0&&<div style={{fontSize:11,color:"#b3392c",fontFamily:SANS,marginTop:8}}>{passed.length} deadline{passed.length>1?"s":""} passed recently on pending deals — review.</div>}
      </SecLink>

      <SecLink title="Follow-ups due" onClick={()=>go("crm")}>
        {dueSoon.length===0?<div style={{fontSize:12,color:"var(--ink-3)",fontFamily:SANS,padding:"6px 0"}}>No follow-ups due in the next {fuDays} days.</div>:
          dueSoon.slice(0,8).map((c,i)=>{const od=c.dt<today;return <div key={c.id} style={{display:"flex",alignItems:"center",gap:9,padding:"6px 0",borderBottom:i<Math.min(dueSoon.length,8)-1?"1px solid var(--line)":"none"}}>
            <span style={{width:26,height:26,borderRadius:"50%",background:"#ece9fb",color:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,fontFamily:SANS,flexShrink:0}}>{initials(c.name)}</span>
            <div style={{flex:1,minWidth:0}}><div style={{fontFamily:SANS,fontSize:12.5,fontWeight:600,color:"var(--ink)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div><div style={{fontFamily:SANS,fontSize:11,color:"var(--ink-2)"}}>{c.type} · {c.stage}</div></div>
            <div style={{fontSize:10,fontFamily:SANS,fontWeight:od?700:400,color:od?"#b3392c":"var(--ink-2)",whiteSpace:"nowrap"}}>{od?"overdue":days(c.dt,today)===0?"today":`${days(c.dt,today)}d`}</div>
          </div>;})}
      </SecLink>
    </div>

    <div className="hb-grid-2" style={{marginBottom:14}}>
      <SecLink title="Projected commission by closing month" onClick={()=>go("sales")}>
        {forecast.length===0?<div style={{fontSize:12,color:"var(--ink-3)",fontFamily:SANS,padding:"6px 0"}}>No scheduled closings with commission yet.</div>:<>
          <div style={{fontFamily:SERIF,fontSize:20,fontWeight:700,color:"#0f7a52",marginBottom:8}}>{fmt(forecast.reduce((s,o)=>s+o.v,0))}<span style={{fontFamily:SANS,fontSize:11,fontWeight:400,color:"var(--ink-2)",marginLeft:6}}>projected pipeline comm</span></div>
          <Bar data={forecast} color="#0f7a52" h={90}/>
        </>}
      </SecLink>

      <SecLink title="CMAs needing attention" onClick={()=>go("cmas")}>
        {cmaAttn.length===0?<div style={{fontSize:12,color:"var(--ink-3)",fontFamily:SANS,padding:"6px 0"}}>All CMAs are resolved.</div>:
          cmaAttn.slice(0,7).map((c,i)=><div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:i<Math.min(cmaAttn.length,7)-1?"1px solid var(--line)":"none"}}>
            <div style={{flex:1,minWidth:0}}><div style={{fontFamily:SANS,fontSize:12.5,fontWeight:600,color:"var(--ink)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.subject}</div><div style={{fontFamily:SANS,fontSize:11,color:"var(--ink-2)"}}>{c.client||"—"} · {(()=>{const sg=cmaSuggested(c,adjLib);return sg?fmt(sg):"—";})()}</div></div>
            <Pill color={cmaColors[c.status||"Draft"]||{bg:"#eee",text:"#555"}}>{c.status||"Draft"}</Pill>
          </div>)}
      </SecLink>
    </div>

    <div style={{background:"var(--surface-2)",border:"1px solid var(--line-2)",padding:"12px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"var(--ink)",fontFamily:SERIF,fontVariant:"small-caps",letterSpacing:"0.03em",marginRight:4}}>Pipeline</span>
        {pipeStatuses.filter(s=>pipeCounts[s]).map(s=>{const sc=statusColors[s]||{bg:"#eee",text:"#555"};return <span key={s} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:11,fontFamily:SANS,padding:"3px 10px",borderRadius:14,background:sc.bg,color:sc.text,fontWeight:600}}>{s}<span style={{background:"var(--surface)",borderRadius:8,padding:"0 6px"}}>{pipeCounts[s]}</span></span>;})}
        {nextClosing&&<span style={{marginLeft:"auto",fontSize:11,fontFamily:SANS,color:"var(--ink-2)"}}>Next closing: <strong style={{color:"var(--ink)"}}>{nextClosing.r.address}</strong> on {isoToShort(nextClosing.r.closing)} ({days(nextClosing.dt,today)}d)</span>}
      </div>
    </div>
  </div>;
}

// ════════════════════════ MY SALES ════════════════════════
function TitleEmailModal({row, patch, profile, onClose}) {
  const S=useSettings();
  const sell = row.side==="sell";
  const [copied,setCopied]=useState(false);
  const userTpls = S.emailTemplates||[];
  const allTpls = [{id:"title",label:"Title Cover",builtin:true}, ...userTpls.map(t=>({id:t.id,label:t.name||"Untitled",tpl:t}))];
  const [tmplId,setTmplId]=useState("title");
  const selT = allTpls.find(t=>t.id===tmplId)||allTpls[0];
  const sig = profile?.agentName ? `${profile.agentName}${profile.email?"\n"+profile.email:""}${profile.phone?"\n"+profile.phone:""}` : "";
  const vals = useMemo(()=>mergeValues(row,profile),[row,profile]);
  const mail = useMemo(()=> selT.builtin
      ? buildTitleEmail({...row,_signature:sig})
      : { subject: mergeTokens(selT.tpl.subject||"", vals), to:[], cc:[], body: mergeTokens(selT.tpl.body||"", vals) }
    ,[row,sig,tmplId,vals,userTpls]);
  const team=row.titleTeam||[], attach=row.attachments||[], tcons=row.titleContacts||[];
  const setTeam=t=>patch(row.id,{titleTeam:t});
  const setAttach=a=>patch(row.id,{attachments:a});
  const setTcons=t=>patch(row.id,{titleContacts:t});
  const copy=async()=>{ const text=`To: ${mail.to.join(", ")}\nCc: ${mail.cc.join(", ")}\nSubject: ${mail.subject}\n\n${mail.body}`; try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);} setCopied(true);setTimeout(()=>setCopied(false),1600); };
  const openMail=()=>{ window.location.href=`mailto:${mail.to.join(",")}?cc=${encodeURIComponent(mail.cc.join(","))}&subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body)}`; };
  const lbl={fontSize:10,fontWeight:700,fontFamily:SANS,color:"var(--accent)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6,display:"block"};
  return <div style={{position:"fixed",inset:0,zIndex:9999,background:"rgba(20,20,25,0.5)",overflow:"auto",padding:"24px 14px"}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{maxWidth:900,margin:"0 auto",background:"#f7f4ec",borderRadius:12,boxShadow:"0 14px 44px rgba(0,0,0,0.32)",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",borderBottom:"1px solid var(--line-2)",background:"#fff"}}>
        <div>
          <div style={{fontFamily:SERIF,fontSize:17,fontWeight:700,color:"var(--accent)"}}>{tmplId==="title"?"Title Company Cover Email":selT.label}</div>
          <div style={{fontFamily:SANS,fontSize:12,color:"var(--ink-2)"}}>{row.address}</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:4,marginRight:4,flexWrap:"wrap"}}>{allTpls.map(t=><button key={t.id} onClick={()=>setTmplId(t.id)} style={{fontSize:11,padding:"5px 11px",borderRadius:4,border:"1px solid",cursor:"pointer",fontFamily:SANS,fontWeight:tmplId===t.id?700:500,background:tmplId===t.id?"var(--accent)":"#fff",color:tmplId===t.id?"#fff":"var(--ink-2)",borderColor:tmplId===t.id?"var(--accent)":"var(--line-2)"}}>{t.label}</button>)}</div>
          {tmplId==="title"&&["buy","sell"].map(s=><button key={s} onClick={()=>patch(row.id,{side:s})} style={{fontSize:11,padding:"5px 12px",borderRadius:4,border:"1px solid",cursor:"pointer",fontFamily:SANS,fontWeight:(row.side||"buy")===s?700:500,background:(row.side||"buy")===s?"var(--accent)":"#fff",color:(row.side||"buy")===s?"#fff":"var(--ink-2)",borderColor:(row.side||"buy")===s?"var(--accent)":"var(--line-2)"}}>{s==="buy"?"Buy-side":"List-side"}</button>)}
          <button onClick={onClose} style={{...btnGhost,marginLeft:6}}>Close</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"minmax(240px,1fr) minmax(300px,1.4fr)",gap:0}}>
        <div style={{padding:"16px 18px",borderRight:"1px solid var(--line)",background:"#fbf9f3"}}>
          {tmplId==="title"?<>
          <div style={{marginBottom:16}}>
            <span style={lbl}>Recipients (Title Team)</span>
            {team.map((t,i)=><div key={i} style={{display:"flex",gap:5,marginBottom:5}}>
              {inp(t.name,v=>setTeam(team.map((x,j)=>j===i?{...x,name:v}:x)),"Name",undefined,{fontSize:11})}
              {inp(t.email,v=>setTeam(team.map((x,j)=>j===i?{...x,email:v}:x)),"Email",undefined,{fontSize:11})}
              <button onClick={()=>setTeam(team.filter((_,j)=>j!==i))} style={{...btnGhost,color:"#b3392c",padding:"3px 8px"}}>×</button>
            </div>)}
            <button onClick={()=>setTeam([...team,{name:"",email:""}])} style={{...btnGhost,fontSize:11,marginTop:2}}>+ Recipient</button>
          </div>
          <div style={{marginBottom:16}}>

              <button onClick={()=>setAttach(attach.filter((_,j)=>j!==i))} style={{...btnGhost,color:"#b3392c",padding:"3px 8px"}}>×</button>

              {inp(t.email,v=>setTcons(tcons.map((x,j)=>j===i?{...x,email:v}:x)),"Email",undefined,{fontSize:11})}
              <button onClick={()=>setTcons(tcons.filter((_,j)=>j!==i))} style={{...btnGhost,color:"#b3392c",padding:"3px 8px"}}>×</button>
            </div>)}
            <button onClick={()=>setTcons([...tcons,{name:"",email:""}])} style={{...btnGhost,fontSize:11,marginTop:2}}>+ Contact</button>

          {(()=>{const used=tokensUsed(`${selT.tpl.subject||""}\n${selT.tpl.body||""}`);return used.length===0

          </div>
          </>}

function MySales({hist,saveHist,escrow,saveEscrow,profile,saveProfile,contacts=[]}) {

  const [tv,setTv]=useState("overview");

  const hYears=useMemo(()=>["All",...Array.from(new Set(hist.map(r=>getYear(r.date)))).filter(Boolean).sort()],[hist]);
  const fH=useMemo(()=>{let rows=[...hist];if(hYear!=="All")rows=rows.filter(r=>getYear(r.date)===hYear);if(hSearch){const q=hSearch.toLowerCase();rows=rows.filter(r=>r.address.toLowerCase().includes(q)||r.zip.includes(q)||(r.source||"").toLowerCase().includes(q));}rows.sort((a,b)=>{let av=a[hSort.col],bv=b[hSort.col];if(hSort.col==="date"){av=parseDate(av);bv=parseDate(bv);}else if(typeof av==="string"){av=av.toLowerCase();bv=(bv||"").toLowerCase();}return hSort.dir==="asc"?(av>bv?1:-1):(av<bv?1:-1);});return rows;},[hist,hYear,hSearch,hSort]);
  const fE=useMemo(()=>eFilter==="All"?escrow:escrow.filter(r=>r.status===eFilter),[escrow,eFilter]);
  const sortedE=useMemo(()=>{
    const {col,dir}=eSort; const mul=dir==="asc"?1:-1; const arr=[...fE];
    arr.sort((a,b)=>{
      if(col==="address") return mul*((a.address||"").localeCompare(b.address||""));
      if(col==="status"){ const d=statusRank(a.status)-statusRank(b.status); return d!==0?mul*d:0; }
      if(col==="price"||col==="agentComm"||col==="gross"){ const d=(+a[col]||0)-(+b[col]||0); return d!==0?mul*d:0; }
      // date columns (ISO yyyy-mm-dd or ""): empties always last
      const ad=a[col]||"", bd=b[col]||"";
      if(!ad&&bd) return 1; if(ad&&!bd) return -1; if(!ad&&!bd) return 0;
      return mul*ad.localeCompare(bd);
    });
    return arr;
  },[fE,eSort]);
  const eTS=(col)=>setESort(p=>p.col===col?{col,dir:p.dir==="asc"?"desc":"asc"}:{col,dir:"asc"});
  const eArrow=(col)=>eSort.col===col?(eSort.dir==="asc"?" ▲":" ▼"):"";
  const eTot=useMemo(()=>({vol:escrow.reduce((s,r)=>s+(r.price||0),0),gross:escrow.reduce((s,r)=>s+(r.gross||0),0),agent:escrow.reduce((s,r)=>s+(r.agentComm||0),0)}),[escrow]);
  const yearly=useMemo(()=>{const m={};hist.forEach(r=>{const y=getYear(r.date);if(!y)return;if(!m[y])m[y]={year:+y,tx:0,vol:0,gross:0,agent:0,brok:0,list:0,buy:0};m[y].tx++;m[y].vol+=r.price||0;m[y].gross+=r.gross||0;m[y].agent+=r.agent||0;m[y].brok+=r.brokerage||0;if(r.type==="S")m[y].list++;else if(r.type==="B")m[y].buy++;});return Object.values(m).sort((a,b)=>a.year-b.year);},[hist]);
  const zipSt=useMemo(()=>{const m={};hist.forEach(r=>{if(!r.zip||r.zip.length<3)return;if(!m[r.zip])m[r.zip]={zip:r.zip,count:0,vol:0,agent:0};m[r.zip].count++;m[r.zip].vol+=r.price||0;m[r.zip].agent+=r.agent||0;});return Object.values(m).sort((a,b)=>b.count-a.count);},[hist]);

    saveHist([newH,...hist]);

  const eDone=(id,key,val)=>saveEscrow(escrow.map(r=>r.id===id?{...r,done:{...(r.done||{}),[key]:val}}:r));

// ──────────── Commissions & Cap Tracker ────────────
function CommissionsView({hist,escrow,saveHist,saveEscrow}) {
  const S=useSettings(); const comm=S.comm||COMM;
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [includePending,setIncludePending]=useState(true);
  const years=useMemo(()=>{const s=new Set([today.getFullYear()]);hist.forEach(r=>{const y=parseDate(r.date).getFullYear();if(y>2000)s.add(y);});return [...s].sort((a,b)=>b-a);},[hist]);

  // tagged, current-year deals with a date — closed (history) + pending (escrow, by closing)
  const seq=useMemo(()=>{
    const closed=hist.filter(r=>r.commType&&parseDate(r.date).getFullYear()===year)
      .map(r=>({src:"hist",id:r.id,date:parseDate(r.date),label:r.date,address:r.address,gross:+r.gross||0,price:+r.price||0,commType:r.commType,override:r.agentNetOverride,brokOv:r.brokerageOverride,closed:true}));
    const pending=includePending?escrow.filter(r=>r.commType&&isoToDate(r.closing)&&isoToDate(r.closing).getFullYear()===year)
      .map(r=>({src:"esc",id:r.id,date:isoToDate(r.closing),label:isoToShort(r.closing)+"/"+isoToDate(r.closing).getFullYear(),address:r.address,gross:+r.gross||0,price:+r.price||0,commType:r.commType,override:r.agentNetOverride,brokOv:r.brokerageOverride,closed:false})):[];
    const all=[...closed,...pending].sort((a,b)=>a.date-b.date);
    let capUsed=0;
    return all.map(d=>{const c=calcCommission(d.gross,d.commType,d.price,capUsed,comm,d.brokOv);capUsed+=c.capContribution;const net=(d.override!=null&&d.override!=="")?+d.override:c.agentNet;return {...d,c,capAfter:capUsed,net,overridden:(d.override!=null&&d.override!=="")};});
  },[hist,escrow,year,includePending]);

  const realizedCap=useMemo(()=>seq.filter(d=>d.closed).reduce((s,d)=>s+d.c.capContribution,0),[seq]);
  const projectedCap=seq.reduce((s,d)=>s+d.c.capContribution,0);
  const capPct=Math.min(100,Math.round(realizedCap/comm.cap*100));
  const projPct=Math.min(100,Math.round(projectedCap/comm.cap*100));
  const capHitRow=seq.find(d=>d.capAfter>=comm.cap);
  const totalNet=seq.reduce((s,d)=>s+d.net,0);
  const totalBrok=seq.reduce((s,d)=>s+(d.c.base-d.net),0);

  // untagged current-year deals (quick tag)
  const untagged=useMemo(()=>{
    const ch=hist.filter(r=>!r.commType&&parseDate(r.date).getFullYear()===year).map(r=>({src:"hist",id:r.id,address:r.address,date:r.date,gross:r.gross}));
    const pe=escrow.filter(r=>!r.commType&&isoToDate(r.closing)&&isoToDate(r.closing).getFullYear()===year).map(r=>({src:"esc",id:r.id,address:r.address,date:isoToShort(r.closing),gross:r.gross}));
    return [...ch,...pe];
  },[hist,escrow,year]);

  const setType=(src,id,t)=>{ if(src==="hist") saveHist(hist.map(r=>r.id===id?{...r,commType:t}:r)); else saveEscrow(escrow.map(r=>r.id===id?{...r,commType:t}:r)); };
  const setOverride=(src,id,v)=>{ if(src==="hist") saveHist(hist.map(r=>r.id===id?{...r,agentNetOverride:v}:r)); else saveEscrow(escrow.map(r=>r.id===id?{...r,agentNetOverride:v}:r)); };
  const setBrokOverride=(src,id,v)=>{ if(src==="hist") saveHist(hist.map(r=>r.id===id?{...r,brokerageOverride:v}:r)); else saveEscrow(escrow.map(r=>r.id===id?{...r,brokerageOverride:v}:r)); };

  const th={textAlign:"left",padding:"6px 8px",fontSize:9.5,color:"var(--ink-2)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:"1px solid var(--rule)",background:"var(--surface-3)",fontFamily:SANS,whiteSpace:"nowrap"};
  const td=(e={})=>({padding:"6px 8px",fontFamily:SANS,fontSize:11.5,borderBottom:"1px solid #e7e4dc",fontVariantNumeric:"tabular-nums",...e});

  return <div>
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      <select value={year} onChange={e=>setYear(+e.target.value)} style={{padding:"7px 12px",fontSize:13,borderRadius:8,border:"1px solid var(--line-2)",background:"#fff",color:"var(--ink)",fontFamily:SANS}}>{years.map(y=><option key={y}>{y}</option>)}</select>
      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontFamily:SANS,color:"var(--ink-2)",cursor:"pointer"}}><input type="checkbox" checked={includePending} onChange={e=>setIncludePending(e.target.checked)} style={{margin:0,accentColor:"var(--accent)"}}/>Include pending (projected)</label>
    </div>

    {/* cap progress */}
    <div style={{background:"var(--surface-2)",border:"1px solid var(--line-2)",padding:16,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8,flexWrap:"wrap",gap:8}}>
        <div style={{fontFamily:SERIF,fontSize:14,fontWeight:700,fontVariant:"small-caps",letterSpacing:"0.03em"}}>Brokerage Cap — {year}</div>
        <div style={{fontSize:12,fontFamily:SANS,color:"var(--ink-2)"}}>30% collections toward {fmt(comm.cap)} cap</div>
      </div>
      <div style={{position:"relative",height:22,background:"#edeae1",borderRadius:4,overflow:"hidden",border:"1px solid var(--line-2)"}}>
        <div style={{position:"absolute",inset:0,width:`${projPct}%`,background:"#cdd6ee"}}/>
        <div style={{position:"absolute",top:0,bottom:0,left:0,width:`${capPct}%`,background:"var(--accent)"}}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:11,fontFamily:SANS,color:"var(--ink-2)"}}>
        <span>Realized (closed): <strong style={{color:"var(--accent)"}}>{fmt(realizedCap)}</strong></span>
        {includePending&&<span>Projected w/ pipeline: <strong style={{color:"var(--ink-2)"}}>{fmt(projectedCap)}</strong></span>}
        <span>{realizedCap>=comm.cap?"✓ Cap met":`${fmt(comm.cap-realizedCap)} to cap`}</span>
      </div>
      {capHitRow&&<div style={{fontSize:11,fontFamily:SANS,color:"#0f7a52",marginTop:6}}>Cap {capHitRow.closed?"met":"projected to be met"} at <strong>{capHitRow.address}</strong> ({capHitRow.label}). Deals after this are split 30%→12%.</div>}
    </div>

    <div className="hb-grid-3" style={{marginBottom:16}}>
      <Card l="Deals in plan" v={String(seq.length)}/>
      <Card l="Agent Net (total)" v={fmt(totalNet)} accent="#0f7a52"/>
      <Card l="To Brokerage (split)" v={fmt(totalBrok)}/>
    </div>

    {seq.length===0?<div style={{fontSize:13,color:"var(--ink-2)",fontFamily:SANS,padding:"10px 0"}}>No tagged {year} deals yet. Tag deals as In House / Out of House (below, in the pipeline detail panel, or in Sales History) to populate the cap tracker.</div>:
    <div className="hb-tablescroll" style={{border:"1px solid var(--line-3)",marginBottom:16}}><table className="hb-rows" style={{borderCollapse:"collapse",minWidth:"100%"}}>
      <thead><tr>
        <th style={th}>Close</th><th style={th}>Address</th><th style={th}>Stage</th><th style={th}>Type</th>
        <th style={{...th,textAlign:"right"}}>Gross</th><th style={{...th,textAlign:"right"}}>Fees</th><th style={{...th,textAlign:"right"}}>Base</th>
        <th style={{...th,textAlign:"right"}}>Brokerage</th><th style={{...th,textAlign:"right"}}>Agent Net</th><th style={{...th,textAlign:"right"}}>Cap After</th>
      </tr></thead>
      <tbody>{seq.map(d=><tr key={d.src+d.id}>
        <td style={td({whiteSpace:"nowrap"})}>{d.label}</td>
        <td style={td({fontWeight:600,whiteSpace:"nowrap"})}>{d.address}</td>
        <td style={td()}><span style={{fontSize:10,padding:"1px 6px",borderRadius:3,background:d.closed?"#dcfce7":"#fef9c3",color:d.closed?"#166534":"#854d0e"}}>{d.closed?"Closed":"Pending"}</span></td>
        <td style={td({whiteSpace:"nowrap"})}>
          <select value={d.commType} onChange={e=>setType(d.src,d.id,e.target.value)} style={{fontSize:11,padding:"3px 5px",border:"1px solid var(--line-2)",borderRadius:4,background:"#fff",color:"var(--ink)",fontFamily:SANS}}>
            <option value="In House">In House</option>
            <option value="Out of House">Out of House</option>
            <option value="">— Untag —</option>
          </select>
        </td>
        <td style={td({textAlign:"right"})}>{fmt(d.gross)}</td>
        <td style={td({textAlign:"right",color:"#b3392c"})}>−{fmt(d.c.audit+d.c.inhouse)}</td>
        <td style={td({textAlign:"right"})}>{fmt(d.c.base)}</td>
        <td style={td({textAlign:"right"})} title={d.c.brokOverridden?`Manual brokerage — ${fmt(d.c.capContribution)} counts toward cap`:`Auto · 30%: ${fmt(d.c.preTake)} · 12%: ${fmt(d.c.postTake)}`}>
          <input value={d.brokOv!=null&&d.brokOv!==""?d.brokOv:""} placeholder={Math.round(d.c.brokerage)} onChange={e=>setBrokOverride(d.src,d.id,e.target.value)}
            style={{width:84,textAlign:"right",fontSize:11.5,padding:"3px 5px",border:d.c.brokOverridden?"1px solid #d97706":"1px solid var(--line)",borderRadius:3,background:d.c.brokOverridden?"#fffaf0":"#fff",color:d.c.brokOverridden?"#9a6700":"#b3392c",fontWeight:600,fontFamily:SANS}}/>
          {d.c.brokOverridden&&<button onClick={()=>setBrokOverride(d.src,d.id,"")} title="Revert to auto split" style={{...btnGhost,fontSize:9,padding:"1px 4px",marginLeft:3}}>↻</button>}
        </td>
        <td style={td({textAlign:"right"})}>
          <input value={d.override!=null&&d.override!==""?d.override:""} placeholder={Math.round(d.c.agentNet)} onChange={e=>setOverride(d.src,d.id,e.target.value)}
            style={{width:88,textAlign:"right",fontSize:11.5,padding:"3px 5px",border:d.overridden?"1px solid #d97706":"1px solid var(--line)",borderRadius:3,background:d.overridden?"#fffaf0":"#fff",color:d.overridden?"#9a6700":"#0f7a52",fontWeight:600,fontFamily:SANS}}/>
          {d.overridden&&<button onClick={()=>setOverride(d.src,d.id,"")} title="Revert to auto" style={{...btnGhost,fontSize:9,padding:"1px 4px",marginLeft:3}}>↻</button>}
        </td>
        <td style={td({textAlign:"right",color:d.capAfter>=comm.cap?"#0f7a52":"var(--ink-2)"})}>{fmt(d.capAfter)}</td>
      </tr>)}</tbody>
      <tfoot><tr style={{borderTop:"2px solid var(--ink)",background:"var(--surface-3)"}}>
        <td style={td({fontWeight:700})} colSpan={4}>Totals ({seq.length})</td>
        <td style={td({fontWeight:700,textAlign:"right"})}>{fmt(seq.reduce((s,d)=>s+d.gross,0))}</td>
        <td style={td()}></td><td style={td({fontWeight:700,textAlign:"right"})}>{fmt(seq.reduce((s,d)=>s+d.c.base,0))}</td>
        <td style={td({fontWeight:700,textAlign:"right",color:"#b3392c"})}>−{fmt(totalBrok)}</td>
        <td style={td({fontWeight:700,textAlign:"right",color:"#0f7a52"})}>{fmt(totalNet)}</td><td style={td()}></td>
      </tr></tfoot>
    </table></div>}

    <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:16}}>Fees = {fmt(comm.auditFee)} audit {`+ in-house (${fmt(comm.inHouseLow)} ≤ ${fmtS(comm.inHouseThreshold)}, ${fmt(comm.inHouseHigh)} above)`}. Brokerage = {Math.round(comm.preCapRate*100)}% of base until the {fmt(comm.cap)} cap, then {Math.round(comm.postCapRate*100)}%. Edit the <strong>Brokerage</strong> figure to set the actual split for a deal — it drives the cap (counting toward the {fmt(comm.cap)} ceiling). Edit <strong>Agent Net</strong> to override take-home. ↻ reverts either to auto.</div>

    {untagged.length>0&&<div style={{background:"var(--surface-2)",border:"1px solid var(--line-2)",padding:14}}>
      <div style={{fontFamily:SERIF,fontSize:13,fontWeight:700,fontVariant:"small-caps",letterSpacing:"0.03em",marginBottom:4}}>Untagged {year} deals ({untagged.length})</div>
      <div style={{fontSize:11,color:"var(--ink-2)",fontFamily:SANS,marginBottom:10}}>These are excluded from the cap until you classify them.</div>
      {untagged.map(d=><div key={d.src+d.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderBottom:"1px solid #e7e4dc"}}>
        <span style={{flex:1,fontSize:12.5,fontFamily:SANS,fontWeight:600}}>{d.address} <span style={{color:"var(--ink-3)",fontWeight:400}}>· {d.date} · {fmt(d.gross)}</span></span>
        {COMM_TYPES.map(t=><button key={t} onClick={()=>setType(d.src,d.id,t)} style={{...btnGhost,fontSize:11,padding:"3px 9px"}}>{t}</button>)}
      </div>)}
    </div>}
  </div>;
}

// ──────────── Report frame (shared print shell) ────────────
function ReportFrame({title,subtitle,profile,saveProfile,onClose,wide,children}) {
  const [brand,setBrand]=useState("luzecky");
  const ACC="var(--accent)",INK="var(--ink)",MUT="var(--ink-2)";
  const brandName=brand==="luzecky"?(profile.luzeckyName||"Luzecky Real Estate"):(profile.decaName||"Deca Realty");
  const tagline=brand==="luzecky"?(profile.luzeckyTagline||""):"";
  const setP=(k,v)=>saveProfile({...profile,[k]:v});
  const ctrlBtn=(on)=>({fontSize:12,padding:"5px 12px",border:`1px solid ${on?ACC:"var(--line-2)"}`,background:on?ACC:"#fff",color:on?"#fff":"var(--ink-2)",cursor:"pointer",fontFamily:SANS,fontWeight:on?600:500,borderRadius:4});
  const fInp=(v,set,ph)=>(<input value={v||""} onChange={e=>set(e.target.value)} placeholder={ph} style={{padding:"5px 8px",fontSize:12,border:"1px solid var(--line-2)",borderRadius:4,fontFamily:SANS,width:"100%",boxSizing:"border-box"}}/>);
  return ReactDOM.createPortal(<div className="cma-print-root" style={{position:"fixed",inset:0,zIndex:9999,background:"#e7e6e1",overflow:"auto"}}>
    <style>{`@media print{.no-print{display:none !important;}html,body{background:#fff !important;margin:0 !important;padding:0 !important;height:auto !important;}body > *:not(.cma-print-root){display:none !important;}.cma-print-root{position:static !important;inset:auto !important;height:auto !important;background:#fff !important;overflow:visible !important;z-index:auto !important;}.cma-print-root *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}.cma-sheet{box-shadow:none !important;margin:0 !important;width:auto !important;max-width:100% !important;padding:0 !important;}.cma-sheet table{page-break-inside:auto;}.cma-sheet tr{page-break-inside:avoid;}@page{size:letter;margin:0.5in;}}`}</style>
    <div className="no-print" style={{position:"sticky",top:0,zIndex:2,background:"#fff",borderBottom:"1px solid var(--line-2)",padding:"10px 16px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:11,color:MUT,fontFamily:SANS,fontWeight:600}}>Brand</span>
        <button onClick={()=>setBrand("luzecky")} style={ctrlBtn(brand==="luzecky")}>Luzecky</button>
        <button onClick={()=>setBrand("deca")} style={ctrlBtn(brand==="deca")}>Deca</button></div>
      <div style={{display:"flex",gap:6,marginLeft:"auto"}}>
        <button onClick={()=>{const prev=document.title;document.title=String(title||"Report").replace(/[\\/:*?"<>|]+/g,"").trim()||prev;const r=()=>{document.title=prev;window.removeEventListener("afterprint",r);};window.addEventListener("afterprint",r);setTimeout(r,120000);window.print();}} style={{...ctrlBtn(true),padding:"7px 16px"}}>Save as PDF</button>
        <button onClick={onClose} style={ctrlBtn(false)}>Close</button>
      </div>
    </div>
    <div className="no-print" style={{background:"#fff",borderBottom:"1px solid var(--line)",padding:"10px 16px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,maxWidth:wide?1100:880,margin:"0 auto"}}>
      {fInp(profile.agentName,v=>setP("agentName",v),"Your name")}
      {fInp(profile.license,v=>setP("license",v),"License #")}
      {fInp(profile.phone,v=>setP("phone",v),"Phone")}
      {fInp(profile.email,v=>setP("email",v),"Email")}
    </div>
    <div className="cma-sheet" style={{maxWidth:wide?1100:880,margin:"18px auto",background:"#fff",boxShadow:"0 2px 14px rgba(0,0,0,0.12)",padding:"38px 42px",fontFamily:SERIF,color:INK}}>
      <div style={{display:"flex",alignItems:"center",gap:14,paddingBottom:15,borderBottom:`3px solid ${INK}`,marginBottom:8}}>
        <div style={{width:40,height:40,borderRadius:7,background:ACC,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:21,fontWeight:700,letterSpacing:"-0.3px"}}>{brandName}</div>
          {tagline&&<div style={{fontSize:12,color:MUT,fontStyle:"italic"}}>{tagline}</div>}
        </div>
        <div style={{textAlign:"right",fontFamily:SANS}}>
          <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",color:MUT,fontWeight:700}}>{title}</div>
          <div style={{fontSize:11,color:MUT,marginTop:2}}>{new Date().toLocaleDateString("en-US")}</div>
        </div>
      </div>
      {subtitle&&<div style={{fontSize:12,color:MUT,fontFamily:SANS,marginBottom:18}}>{subtitle}</div>}
      {children}
      <div style={{borderTop:`2px solid ${INK}`,marginTop:24,paddingTop:14,display:"flex",justifyContent:"space-between",alignItems:"flex-end",fontFamily:SANS}}>
        <div>
          <div style={{fontSize:14,fontWeight:700,color:INK}}>{profile.agentName}</div>
          <div style={{fontSize:11,color:MUT}}>{profile.title}{profile.license?` · Lic. ${profile.license}`:""}</div>
          <div style={{fontSize:11,color:MUT}}>{[profile.phone,profile.email].filter(Boolean).join("  ·  ")}</div>
          <div style={{fontSize:11,color:MUT,marginTop:2}}>{brandName}</div>
        </div>
        <div style={{fontSize:9,color:"var(--ink-3)",textAlign:"right",maxWidth:280,lineHeight:1.4}}>Prepared from internal production records. Figures are unaudited and for informational use.</div>
      </div>
    </div>
  </div>, document.body);
}

// ──────────── My Sales PDF reports ────────────
function SalesReport({type,hist,escrow,fH,fE,hYear,hSearch,eFilter,yearly,zipSt,srcSt,monthly,eTot,profile,saveProfile,onClose}) {
  const ACC="var(--accent)",INK="var(--ink)",MUT="var(--ink-2)",RULE="var(--line-2)",GREEN="#0f7a52";
  const th={textAlign:"left",padding:"6px 8px",fontSize:9.5,color:MUT,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:`2px solid ${INK}`,background:"var(--surface-3)",fontFamily:SANS,whiteSpace:"nowrap"};
  const td=(e={})=>({padding:"5px 8px",fontFamily:SANS,fontSize:11,borderBottom:`1px solid #e7e4dc`,fontVariantNumeric:"tabular-nums",...e});
  const secH=(t)=>(<div style={{fontSize:13,fontWeight:700,fontVariant:"small-caps",letterSpacing:"0.03em",borderBottom:`2px solid ${INK}`,paddingBottom:5,margin:"20px 0 10px"}}>{t}</div>);
  const Tiles=({items})=>(<div style={{display:"grid",gridTemplateColumns:`repeat(${items.length},1fr)`,border:`1px solid ${RULE}`,marginBottom:6}}>
    {items.map(([l,v,c],i)=><div key={i} style={{padding:"12px 14px",borderLeft:i?`1px solid ${RULE}`:"none",borderTop:`3px solid ${c||ACC}`}}>
      <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.07em",color:MUT,fontFamily:SANS,fontWeight:700}}>{l}</div>
      <div style={{fontSize:20,fontWeight:700,color:c||INK,fontFamily:SERIF,fontVariantNumeric:"tabular-nums"}}>{v}</div>
    </div>)}
  </div>);

  // ESCROW
  if(type==="escrow"){
    const rows=fE;
    const sched=rows.filter(r=>CONTINGENCIES.some(c=>r[c.key]));
    return <ReportFrame title="Pipeline & Escrow" subtitle={`${rows.length} transactions${eFilter!=="All"?` · ${eFilter}`:""} · as of ${new Date().toLocaleDateString("en-US")}`} profile={profile} saveProfile={saveProfile} onClose={onClose}>
      <Tiles items={[["Pipeline Volume",fmtS(rows.reduce((s,r)=>s+(r.price||0),0))],["Gross Commission",fmt(rows.reduce((s,r)=>s+(r.gross||0),0))],["Agent Commission",fmt(rows.reduce((s,r)=>s+(r.agentComm||0),0)),GREEN]]}/>
      {secH("Transactions")}
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><th style={th}>Address</th><th style={th}>Status</th><th style={{...th,textAlign:"right"}}>Sale Price</th><th style={{...th,textAlign:"right"}}>Gross</th><th style={{...th,textAlign:"right"}}>Agent Comm</th><th style={th}>Closing</th></tr></thead>
        <tbody>{rows.map(r=><tr key={r.id}><td style={td({fontWeight:600})}>{r.address}</td><td style={td()}>{r.status}</td><td style={td({textAlign:"right"})}>{fmt(r.price)}</td><td style={td({textAlign:"right"})}>{fmt(r.gross)}</td><td style={td({textAlign:"right",color:GREEN})}>{fmt(r.agentComm)}</td><td style={td()}>{isISO(r.closing)?isoToShort(r.closing)+"/"+isoToDate(r.closing).getFullYear():"—"}</td></tr>)}</tbody>
        <tfoot><tr><td style={td({fontWeight:700,borderTop:`2px solid ${INK}`})}>Totals ({rows.length})</td><td style={td({borderTop:`2px solid ${INK}`})}></td><td style={td({fontWeight:700,textAlign:"right",borderTop:`2px solid ${INK}`})}>{fmt(rows.reduce((s,r)=>s+(r.price||0),0))}</td><td style={td({fontWeight:700,textAlign:"right",borderTop:`2px solid ${INK}`})}>{fmt(rows.reduce((s,r)=>s+(r.gross||0),0))}</td><td style={td({fontWeight:700,textAlign:"right",borderTop:`2px solid ${INK}`,color:GREEN})}>{fmt(rows.reduce((s,r)=>s+(r.agentComm||0),0))}</td><td style={td({borderTop:`2px solid ${INK}`})}></td></tr></tfoot>
      </table>
      {sched.length>0&&<>{secH("Contingency Schedule")}
        {sched.map(r=><div key={r.id} style={{marginBottom:10,breakInside:"avoid"}}>
          <div style={{fontFamily:SERIF,fontWeight:700,fontSize:13,marginBottom:3}}>{r.address} <span style={{fontFamily:SANS,fontSize:10,color:MUT,fontWeight:400}}>· {r.status}</span></div>
          <div style={{display:"flex",flexWrap:"wrap",gap:"3px 14px"}}>
            {CONTINGENCIES.filter(c=>r[c.key]).map(c=>{const dn=r.done&&r.done[c.key];return <span key={c.key} style={{fontFamily:SANS,fontSize:11,color:INK}}><span style={{color:MUT}}>{c.short}:</span> {isoToShort(r[c.key])}{dn&&<span style={{color:GREEN,fontWeight:700}}> ✓</span>}</span>;})}
          </div>
        </div>)}
      </>}
    </ReportFrame>;
  }

  // CALENDAR
  if(type==="calendar"){
    const evs=[];escrow.forEach(r=>CONTINGENCIES.forEach(c=>{const dt=isoToDate(r[c.key]);if(dt)evs.push({dt,iso:r[c.key],addr:r.address,short:c.short,label:c.label,status:r.status,done:!!(r.done&&r.done[c.key]),key:c.key});}));
    evs.sort((a,b)=>a.dt-b.dt);
    const groups={};evs.forEach(e=>{const k=e.iso;(groups[k]=groups[k]||[]).push(e);});
    const keys=Object.keys(groups).sort();
    return <ReportFrame title="Transaction Calendar" subtitle={`Contingency deadline schedule · ${evs.length} deadlines (${evs.filter(e=>!e.done).length} open)`} profile={profile} saveProfile={saveProfile} onClose={onClose}>
      {keys.length===0?<div style={{fontSize:12,color:MUT,fontFamily:SANS}}>No contingency dates entered.</div>:
        keys.map(k=>{const dt=isoToDate(k);return <div key={k} style={{display:"flex",gap:12,padding:"7px 0",borderBottom:`1px solid #e7e4dc`,breakInside:"avoid"}}>
          <div style={{width:96,flexShrink:0,fontFamily:SANS}}><div style={{fontWeight:700,fontSize:12,color:INK}}>{MONTHS[dt.getMonth()].slice(0,3)} {dt.getDate()}, {dt.getFullYear()}</div><div style={{fontSize:10,color:MUT}}>{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getDay()]}</div></div>
          <div style={{flex:1}}>{groups[k].map((e,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,fontFamily:SANS,fontSize:11.5,padding:"1px 0"}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:e.done?"#9bb3a4":CONTINGENCY_COLORS[e.key],flexShrink:0}}/>
            <span style={{fontWeight:600,textDecoration:e.done?"line-through":"none",color:e.done?MUT:INK}}>{e.addr}</span>
            <span style={{color:MUT}}>{e.label}</span>{e.done&&<span style={{color:GREEN,fontWeight:700}}>✓</span>}
          </div>)}</div>
        </div>;})}
    </ReportFrame>;
  }

  // HISTORY
  if(type==="history"){
    const rows=fH;
    const tot=(f)=>rows.reduce((s,r)=>s+(+r[f]||0),0);
